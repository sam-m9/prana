<div id="root"></div>
<style>
:root{
  --bg:#0a090c; --panel:#141218; --panel2:#0f0d12; --line:#26232d; --line2:#332f3b;
  --ink:#eae7f0; --mute:#8b8894; --mute2:#5f5c68;
  --copper:#cf9a4a; --copper-l:#e0be86;
  --sage:#93b39a; --sage-l:#a6c9ad;
  --crimson:#d0655f; --crimson-l:#e6a29d;
  --bone:#d6d3c7;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px}
/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0a090c 70%,rgba(10,9,12,.92));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:22px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wordmark{font-family:var(--sans);font-weight:800;letter-spacing:10px;font-size:26px;color:#f0eee6}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--mute)}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--mute);margin-top:6px;line-height:1.6}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-family:var(--sans);font-weight:800;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--mute);margin-top:4px;text-transform:uppercase}
.stat.keep .n{color:var(--sage-l)} .stat.del .n{color:var(--crimson-l)} .stat.tot .n{color:var(--bone)}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.mini span{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--mute)}
/* controls */
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 0 14px}
.search{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:11px 14px;color:var(--ink);font-size:14px;font-family:var(--mono)}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:9px 13px;border-radius:10px;border:1px solid var(--line2);color:var(--mute);background:transparent;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--mute)}
.chip.on{color:#12100c;background:var(--copper);border-color:var(--copper);font-weight:600}
.chip.on.keep{background:var(--sage);border-color:var(--sage)}
.chip.on.del{background:var(--crimson);border-color:var(--crimson);color:#1a0d0c}
select.cat{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--ink);font-family:var(--mono);font-size:12px}
/* category group */
.grp{margin-top:26px}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ghead h2{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:1px;margin:0;text-transform:uppercase}
.ghead .rule{flex:1;height:1px;background:var(--line)}
.ghead .cnt{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:1px}
/* rows */
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}
.row .stripe{background:var(--mute2)}
.row.tier1 .stripe{background:var(--sage)} .row.tier2 .stripe{background:var(--copper)} .row.tier3 .stripe{background:var(--bone)}
.row.disqualify .stripe{background:var(--crimson)} .row.delete_unverifiable .stripe{background:var(--mute2)}
.row .body{padding:13px 15px;min-width:0}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-family:var(--sans);font-weight:600;font-size:15px;color:#f2f0f6}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;font-weight:700;padding:4px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.b-tier1{background:rgba(147,179,154,.16);color:var(--sage-l);border:1px solid rgba(147,179,154,.4)}
.b-tier2{background:rgba(207,154,74,.16);color:var(--copper-l);border:1px solid rgba(207,154,74,.42)}
.b-tier3{background:rgba(214,211,199,.14);color:var(--bone);border:1px solid rgba(214,211,199,.3)}
.b-disqualify{background:rgba(208,101,95,.16);color:var(--crimson-l);border:1px solid rgba(208,101,95,.44)}
.b-delete_unverifiable{background:rgba(139,136,148,.16);color:var(--mute);border:1px solid var(--line2)}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.5px;margin-top:3px}
.reason{font-size:13px;line-height:1.5;color:#cfccd7;margin-top:8px}
.conf{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.conf.high{color:var(--sage);border:1px solid rgba(147,179,154,.3)}
.conf.medium{color:var(--copper-l);border:1px solid rgba(207,154,74,.3)}
.conf.low{color:var(--crimson-l);border:1px solid rgba(208,101,95,.35)}
.gd{font-family:var(--sans);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;text-align:right;padding:13px 15px;color:var(--bone);white-space:nowrap}
.gd small{font-family:var(--mono);font-weight:400;font-size:9px;color:var(--mute2);display:block;letter-spacing:1px}
.det{grid-column:2/4;padding:0 15px 14px;display:none}
.row.open .det{display:block}
.det .k{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--mute2);text-transform:uppercase;margin:10px 0 4px}
.det .ing{font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--mute);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-word}
.det a{color:var(--copper-l);font-size:11px;font-family:var(--mono);word-break:break-all;display:block;margin-top:3px;text-decoration:none}
.det a:hover{text-decoration:underline}
.expand{font-family:var(--mono);font-size:10px;color:var(--mute2);letter-spacing:1px;cursor:pointer;margin-top:8px;user-select:none}
.expand:hover{color:var(--copper-l)}
.empty{text-align:center;padding:60px 0;color:var(--mute);font-family:var(--mono);font-size:13px}
.legend{font-family:var(--mono);font-size:10px;color:var(--mute2);letter-spacing:.5px;margin-top:8px;line-height:1.7}
</style>
<script>
const DATA=[{"id":47,"name":"Seeded Hamburger Buns / Commercial Wheat Loaves (H-E-B Bake Shop)","cat":"Bread","store":"heb","price":3.19,"gd":17.8,"decision":"disqualify","dqLevel":"L3","reason":"Contains soybean oil (L3 industrial seed oil) and sunflower lecithin (L3 emulsifier), plus added sugar (L2) in a savory staple.","justification":"Solvent-extracted soybean oil carries oxidized PUFA hydroperoxides that skew membrane omega ratios (Principle 3), sunflower lecithin disrupts the mucosal barrier (Principle 1), and added sugar drives lipogenic glycemic influx (Principle 4) — a triple pre-filter fail.","confidence":"high","ingredients":"Enriched wheat flour, water, sugar, yeast, soybean oil, and 2% or less of: salt, sesame seeds, sunflower lecithin, wheat gluten, natural flavor, calcium sulfate, calcium phosphate, wheat flour, potassium.","sources":["https://www.heb.com/product-detail/h-e-b-enriched-seeded-hamburger-buns/395777"],"notes":"Verified deck differs from the original audit (no HFCS, monoglycerides or calcium propionate in this H-E-B Select Ingredients version — it uses cane sugar and soybean oil instead), but the product remains disqualified on seed oil + emulsifier + added sugar."},{"id":43,"name":"Organic Fitness Whole Rye Bread (Mestemacher)","cat":"Bread","store":"heb","price":3.99,"gd":14.2,"decision":"tier3","dqLevel":null,"reason":"Whole-kernel rye brick loaf with a fully clean deck (no oil, sugar, gums or preservatives) but yeast-leavened rather than wild-fermented or sprouted.","justification":"Intact whole rye kernels give high fiber and low glycemic influx (Principle 4), but standard yeast leavening bypasses the long acidification needed to fully pre-digest rye fructans (Principle 5), so it lands in the clean fallback tier rather than Gold Standard.","confidence":"medium","ingredients":"Whole kernel rye, water, oat kernels, wholemeal rye flour, iodized salt, wheat germ, oat fiber, yeast. (Organic whole-rye variant: organic whole kernel rye, water, organic whole rye flour, organic oat flakes, organic barley flakes, organic flax seed, sea salt, organic sesame, yeast.)","sources":["https://www.mestemacher-gmbh.com/product/natural-fitness-bread-usa/","https://www.wholefoodsmarket.com/grocery/product/mestemacher-bread-fitness-17-6-ounce-b00514dbgu","https://europeandeli.com/products/organic-whole-kernel-rye-water-organic-whole-rye-flour-organic-oat-flakes-organic-barley-flakes-organic-flax-seed-sea-salt-organic-sesame-yeast-may-contain-traces-of-soy-milk-and-tree-nuts"],"notes":"Exact 'Organic Fitness' variant naming is ambiguous across Mestemacher's Fitness / Organic Whole Rye lines; all found variants are clean (rye, seeds, salt, yeast) and none contain sugar, oil, gums or preservatives, so the tier holds regardless of which variant."},{"id":46,"name":"21 Whole Grains and Seeds Bread (Dave's Killer Bread)","cat":"Bread","store":"heb","price":5.79,"gd":9.8,"decision":"disqualify","dqLevel":"L2","reason":"Contains organic cane sugar and organic molasses — added sugar/syrup in a savory staple.","justification":"Added cane sugar and molasses flood the hepatic portal vein with rapid free sugar (Principle 4), which the pre-filter disqualifies in bread regardless of the otherwise whole-grain seed matrix; 'organic' does not exempt added sugar.","confidence":"high","ingredients":"Organic whole wheat (organic whole wheat flour, organic cracked whole wheat), water, organic cane sugar, organic 21 Whole Grains and Seeds mix (organic whole flax seeds, organic sunflower seeds, organic tri-color quinoa, organic ground whole flax seeds, organic triticale, organic pumpkin seeds, organic rolled barley, organic rolled oats, organic rolled rye, organic blue cornmeal, organic millet, organic rolled spelt, organic brown rice flour, organic amaranth flour, organic yellow cornmeal, organic KAMUT khorasan wheat, organic sorghum flour, organic buckwheat flour, organic quinoa, organic po","sources":["https://www.daveskillerbread.com/21-whole-grains-and-seeds","https://www.amazon.com/Daves-Killer-Bread-Grains-Organic/dp/B001F79MMY"],"notes":"Whole-grain/seed content is genuinely high, but added sugar is an absolute savory-staple disqualifier. Matches original 'seed'/DQ assessment (driver is sugar, not seed oil)."},{"id":42,"name":"San Francisco Style Sourdough Sliced (Izzio Artisan Bakery)","cat":"Bread","store":"heb","price":5.99,"gd":9.5,"decision":"tier1","dqLevel":null,"reason":"Genuine wild sourdough culture (no added baker's yeast) with a clean deck — zero seed oils, added sugar, gums, dyes or preservatives.","justification":"Leavening is driven solely by the wild sourdough culture, giving true long-fermentation acidification and FODMAP pre-digestion (Principle 5); malted barley flour and enzymes are non-sweetener processing components, not disqualifiers.","confidence":"medium","ingredients":"Wheat Flour, Water, Sourdough Culture (Wheat Flour, Water), Whole Wheat Flour, Sea Salt, Malted Barley Flour, Enzymes.","sources":["https://www.kroger.com/p/izzio-artisan-bakery-san-francisco-style-sourdough-bread/0065708206040","https://izziobakery.com/shop/artisan-sourdough-sandwich-bread/organic-san-francisco-style-sandwich-bread/"],"notes":"Predominantly refined wheat flour with some whole wheat; enzymes are dough-improver processing aids (not the DATEM/mono-diglyceride conditioners the spec bans). Original current_flag 'tool' is unwarranted — no engineered isolate present."},{"id":37,"name":"Ezekiel 4:9 Sprouted Whole Grain Bread (Food For Life)","cat":"Bread","store":"heb","price":6.78,"gd":8.4,"decision":"tier1","dqLevel":null,"reason":"Flourless sprouted whole-grain and legume matrix; zero seed oils, zero added sugar, zero gums/preservatives.","justification":"Sprouting activates endogenous phytase to pre-digest phytic acid and FODMAPs (Principle 5) and the grain+legume blend yields a complete, highly bioavailable amino-acid profile with minimal glycemic influx.","confidence":"high","ingredients":"Organic Sprouted Wheat, Filtered Water, Organic Sprouted Barley, Organic Sprouted Millet, Organic Malted Barley, Organic Sprouted Lentils, Organic Sprouted Soybeans, Organic Sprouted Spelt, Organic Wheat Gluten, Yeast, Sea Salt.","sources":["https://www.foodforlife.com/product/breads/ezekiel-49-sprouted-whole-grain-bread","https://sbnf.net/products/ezekiel-4-9-sprouted-grain-bread-original-organic"],"notes":"Original variant audited. Contains added baker's yeast but base is sprouted, not conditioned; qualifies as Gold Standard."},{"id":39,"name":"Ezekiel 4:9 Sprouted Grain Flax Bread (Food For Life)","cat":"Bread","store":"heb","price":6.78,"gd":8.4,"decision":"tier1","dqLevel":null,"reason":"Sprouted grain/legume base plus sprouted flax; zero seed oils, added sugar, gums or preservatives.","justification":"Sprouting pre-digests antinutrients (Principle 5) while ALA-rich flax supports a favorable membrane omega-3 balance (Principle 3); intact whole-food matrix with slow glycemic influx.","confidence":"high","ingredients":"Organic Sprouted Wheat, Filtered Water, Organic Sprouted Flax, Organic Sprouted Barley, Organic Sprouted Millet, Organic Malted Barley, Organic Sprouted Lentils, Organic Sprouted Soybeans, Organic Sprouted Spelt, Organic Wheat Gluten, Yeast, Sea Salt, Rolled in Organic Flax Seeds.","sources":["https://www.foodforlife.com/product/breads/ezekiel-49-flax-sprouted-whole-grain-bread","https://www.heb.com/product-detail/food-for-life-ezekiel-4-9-flax-bread/1586732"],"notes":"Flax is a whole seed, not an extracted oil; not a disqualifier."},{"id":41,"name":"Local Artisan Sourdough Bread (Easy Tiger)","cat":"Bread","store":"heb","price":6.98,"gd":8.1,"decision":"disqualify","dqLevel":"L2","reason":"Malt Powder contains Dextrose — an added sugar in a savory staple category.","justification":"Added dextrose delivers rapid monosaccharide influx to the hepatic portal vein without a protective matrix (Principle 4), which the pre-filter disqualifies in any bread; the sugar rule is absolute regardless of the otherwise-clean sourdough base.","confidence":"medium","ingredients":"Unbleached Flour (Wheat Flour, Enzyme), Water, Sea Salt, Malt Powder (Malted Barley Flour, Wheat Flour, Dextrose).","sources":["https://spoonfulapp.com/products/easy-tiger-austin-sourdough-boule/NjY0NTQxNjQ4NDYyMA==","https://us.openfoodfacts.org/product/18683288/austin-sourdough-easy-tiger","https://www.amazon.com/Easy-Tiger-Bakery-Bread-Sourdough/dp/B0882158GS"],"notes":"Packaged retail Easy Tiger 'Austin Sourdough' deck (multiple listings) lists dextrose inside the malt powder. The unpackaged in-cafe loaf may be only flour/water/salt/starter, but the verifiable retail product is disqualified."},{"id":38,"name":"Old Fashioned Sourdough Spelt Bread (Berlin Natural Bakery)","cat":"Bread","store":"heb","price":8.99,"gd":6.3,"decision":"tier1","dqLevel":null,"reason":"Three-ingredient ancient-grain (spelt) loaf leavened by 24+ hour wild sourdough fermentation; zero oil, sugar, gums or preservatives.","justification":"Long wild acidification of a whole ancient grain maximally pre-digests fructans/FODMAPs (Principle 5), giving a low-bloat, high-tolerance staple with an intact whole-food matrix.","confidence":"high","ingredients":"Organic Whole Grain Spelt Flour, Filtered Water, Sea Salt.","sources":["https://www.berlinnaturalbakery.com/products/sourdough-spelt-bread","https://www.wholefoodsmarket.com/grocery/product/berlin-bakery-sourdough-spelt-bread-24-oz-b071xv88v9"],"notes":"Fermented at least 24 hours per brand; classic Gold Standard sourdough."},{"id":40,"name":"Scratch-Baked Artisan Sourdough Loaf (Central Market Bakery)","cat":"Bread","store":"heb","price":8.99,"gd":6.3,"decision":"tier3","dqLevel":null,"reason":"Clean deck (no oil, sugar, gums, dyes or preservatives) but refined enriched white flour and added commercial yeast make it a yeast-accelerated hybrid rather than a pure whole-grain wild ferment.","justification":"The genuine sourdough culture provides some acidification, but added baker's yeast shortens fermentation and the refined flour lacks the whole-food matrix, so it falls short of the full FODMAP pre-digestion of Tier 1 (Principle 5).","confidence":"medium","ingredients":"Unbleached Enriched Flour (Wheat Flour, Malted Barley Flour, Niacin, Reduced Iron, Thiamine Mononitrate, Riboflavin, Folic Acid), Water, Sourdough (Water, Fermented Wheat Flour), Organic Sifted Wheat Flour, and contains less than 1.5% of each of the following: Sea Salt, Yeast, Wheat Gluten, Malted Barley Extract, Microbial Enzymes (Amylase, Amyloglucosidase, Lipase, Xylanase).","sources":["https://www.heb.com/product-detail/central-market-sourdough-loaf/5689028"],"notes":"Enrichment vitamins and microbial enzymes are processing aids/fortification, not L2/L3 disruptors per spec. Matched to Central Market Sourdough Loaf packaged deck; in-store scratch bake may vary slightly."},{"id":44,"name":"Ezekiel 4:9 Sprouted Grain Cinnamon Raisin Bread (Food For Life)","cat":"Bread","store":"heb","price":8.98,"gd":6.3,"decision":"tier1","dqLevel":null,"reason":"Sprouted grain/legume base sweetened only by whole organic raisins (whole fruit); no added refined sugar, syrup, oil, gums or preservatives.","justification":"Raisins are a whole-food fruit (an allowed Tier-1 sweetener), not extracted/added sugar, so no glycemic pre-filter is triggered (Principle 4); the sprouted matrix retains full enzymatic pre-digestion (Principle 5).","confidence":"high","ingredients":"Organic Sprouted Wheat, Filtered Water, Organic Raisins, Organic Sprouted Barley, Organic Sprouted Millet, Organic Malted Barley, Organic Sprouted Lentils, Organic Sprouted Soybeans, Organic Sprouted Spelt, Fresh Yeast, Organic Wheat Gluten, Sea Salt, Organic Cinnamon.","sources":["https://www.foodforlife.com/product/breads/ezekiel-49-cinnamon-raisin-sprouted-whole-grain-bread","https://www.kroger.com/p/food-for-life-ezekiel-4-9-organic-cinnamon-raisin-sprouted-grain-bread/0007347201131"],"notes":"Flavored variant audited as named. Sweetness derives from whole raisins, not added sugar — remains Tier 1; original 'tool' flag is unwarranted."},{"id":45,"name":"Classic White Bread (Hero Bread)","cat":"Bread","store":"heb","price":11.99,"gd":4.7,"decision":"disqualify","dqLevel":"L3","reason":"Contains Guar Gum and Sunflower Lecithin (L3 emulsifiers/gums), plus engineered fiber/protein isolates (resistant wheat starch, wheat protein, fava bean protein).","justification":"Guar gum and sunflower lecithin act as surfactants that strip the intestinal mucin layer and compromise tight junctions (Principle 1), and the forced-isolate protein/fiber matrix is a denatured engineered construct (Principle 2) — both trigger the L3 pre-filter, disqualifying it.","confidence":"high","ingredients":"Water, Resistant Wheat Starch, Wheat Protein, Olive Oil, Yeast, Milled Flaxseed, Contains Less than 2% of Vinegar, Salt, Fava Bean Protein, Guar Gum, Cultured Wheat Flour, Wheat Flour, Enzymes, Monk Fruit Extract, Ascorbic Acid, Sunflower Lecithin.","sources":["https://foodisgood.com/product/hero-classic-white-bread/","https://www.hero.co/products/sliced-white-bread","https://www.fredmeyer.com/p/hero-classic-white-bread/0086000822233"],"notes":"Olive oil and monk fruit are individually acceptable, but the gums/lecithin and engineered isolates are hard L3 disqualifiers. Original 'tool' flag is insufficient — product is filtered out, not capped."},{"id":114,"name":"Land O Lakes Butter Spread with Canola Oil (15 oz)","cat":"Butter","store":"heb","price":3.92,"gd":0.9,"decision":"disqualify","dqLevel":"L3","reason":"Contains industrial refined canola oil.","justification":"Refined canola is a PUFA-rich seed oil carrying cytotoxic hydroperoxides/aldehydes that skew membrane omega-6:3 ratios (P3) — an automatic L3 disqualification for a savory staple.","confidence":"high","ingredients":"Pasteurized Sweet Cream, Canola Oil, Salt.","sources":["https://www.landolakes.com/ gredients":"Wheat Flour, Butter (from Milk), Sugar, Salt.","sources":["https://www.amazon.com/Walkers-Pure-Butter-Shortbread-Rounds/dp/B000V9XM1O","https://www.walkersshortbread.com/shortbread-fingers/"],"notes":"Audited the plain/original 'Pure Butter' Rounds variant. Vanilla variant adds non-fat dry milk + natural vanilla but is also clean."},{"id":242,"name":"Crunchy Almond Flour Chocolate Chip Cookies (Simple Mills)","cat":"Cookies","store":"heb","price":4.93,"gd":1.9,"decision":"tier3","dqLevel":null,"reason":"No industrial seed oils (coconut oil only), no soy lecithin in the chocolate chips, no gums or polyols. Whole nut/seed flour base; sweetened with cane sugar (in chips) + organic coconut sugar.","justification":"Passes all pre-filters (P3: coconut oil, no seed-oil hydroperoxides; P1: chocolate chips are cocoa-butter-only with no emulsifier). The 'flaxseed' component is whole-seed flour, not seed oil, so the prior 'seed' flag was a misread. Refined cane sugar + starch fillers cap it at Tier 3 in this sweet category.","confidence":"high","ingredients":"Nut & Seed Flour Blend (Almonds, Organic Coconut, Flaxseeds), Tapioca Starch, Chocolate Chips (Cane Sugar, Unsweetened Chocolate, Cocoa Butter), Organic Coconut Sugar, Organic Coconut Oil, Arrowroot, Vanilla Extract, Sea Salt, Baking Soda, Cream of Tartar, Rosemary Extract (for freshness).","sources":["https://simplemills.com/Products/Product/Crunchy-Chocolate-Chip-Cookies.aspx","https://www.heb.com/product-detail/simple-mills-crunchy-almond-flour-chocolate-chip-cookies/2109655","https://www.wholefoodsmarket.com/grocery/product/simple-mills-simple-mills-almond-flour-chocolate-chip-cookies-gluten-free-and-delicious-crunchy-cookies-organic-coconut-oil-good-for-snacks-packaging-may-vary-b071z2hwyc"],"notes":"Prior catalog flags ['seed','sugar'] were incorrect on the seed-oil point; chocolate chips contain no soy lecithin in the current deck."},{"id":240,"name":"Organic Vanilla Cream Ancient Grain Biscuits (Olyra) 3 engineered fiber filler."},{"id":238,"name":"Go Raw Organic Original Super Cookies (Go Raw)","cat":"Cookies","store":"heb","price":3.48,"gd":1.5,"decision":"tier2","dqLevel":null,"reason":"Sprouted-seed, whole-food matrix with zero L1/L2/L3 signals; sweetened primarily by whole-fruit dates plus a small amount of organic coconut sugar. Sprouting is a genuine Tier-1 pre-digestion trait; the added coconut sugar (not on the Tier-1 sweetener list) drops it one notch to Tier 2.","justification":"Directly embodies P5 (enzymatic pre-digestion / antinutrient attenuation via <105F sprouting of sesame, reducing phytic acid and FODMAP load) and P4 (dates provide sugar inside an intact fibrous fruit matrix). No seed oils, gums, or synthetic sweeteners. Coconut sugar is an unrefined granulated sugar rather than a Tier-1 whole-fruit/honey/maple sweetener, so ceiling is Tier 2.","confidence":"medium","ingredients":"Organic Dates, Organic Sprouted Sesame Seeds, Organic Unsulphured Coconut, Organic Coconut Sugar, Sea Salt.","sources":["https://www.heb.com/product-detail/go-raw-organic-original-super-cookies/1281819","https://www.instacart.com/products/284525-go-raw-cookies-super-original-3-oz","https://buyithealthy.com/i-20212141-go-raw-original-super-cookies-3-oz-6-pack.html"],"notes":"Marketing says 'no added sugar' yet coconut sugar appears in the deck; original variant audited. Coconut sugar quantity is small (dates dominate)."},{"id":245,"name":"Honey Cinnamon Seed & Nut Sweet Thins (Simple Mills)","cat":"Cookies","store":"wf","price":4.97,"gd":1.4,"decision":"tier3","dqLevel":null,"reason":"No industrial seed oils (the 'sunflower' is whole sunflower SEED flour, not oil; only coconut oil is used), no lecithin, gums, polyols, or synthetic sweeteners. Sweetened with honey (Tier-1 sweetener) plus coconut sugar.","justification":"Clears all pre-filters (P3: coconut oil only; the seed components are intact whole-seed flours, not extracted seed oils). Honey is a Tier-1 sweetener, bu nciple 2).","confidence":"high","ingredients":"Cultured Grade A Nonfat Milk, Water, Natural Flavors, Contains Less Than 1% Of: Tapioca Starch, Stevia Leaf Extract, Lemon Juice Concentrate, Sea Salt, Vitamin D3, Yogurt Cultures (S. Thermophilus & L. Bulgaricus).","sources":["https://www.amazon.com/Dannon-Company-Oikos-Triple-Vanilla/dp/B01J7GO9P4","https://www.fairwaymarket.com/product/oikos-triple-zero-vanilla-blended-greek-nonfat-yogurt-32-oz-id-00036632019448","https://www.amazon.com/Dannon-Oikos-Triple-Blended-Vanilla/dp/B00T4E0O36"],"notes":"Vanilla flavor audited (name specifies flavor). IMPORTANT: original catalog audit was inaccurate - actual deck has NO whey protein concentrate and NO 'modified food starch'; it uses tapioca starch and stevia. Sweetener is pure stevia leaf extract (no erythritol/polyols), but the starch stabilizer + water dilution disqualify it from the clean-stevia Tier 2 allowance. Deck corroborated via Amazon/Fairway (direct fetch blocked 403)."},{"id":2,"name":"Straus Family Creamery Organic Whole Milk Plain Greek Yogurt","cat":"Yogurt","store":"heb","price":7.99,"gd":10.2,"decision":"tier2","dqLevel":null,"reason":"Clean organic whole-milk Greek yogurt, traditionally cultured/strained with no synthetic thickeners or pectin; zero added sugar. Conventional (non-A2) cow genetics keeps it out of Tier 1.","justification":"100% safe whole-milk dairy matrix with no emulsifiers (Principle 1) or added sugar (Principle 4); lacks the A2/sheep/goat pre-digestion optimization that defines Tier 1.","confidence":"high","ingredients":"Pasteurized Organic Whole Milk, Organic Sweet Cream (Buttermilk), Living Yogurt Cultures: L. Acidophilus, L. Bulgaricus, S. Thermophilus, Bifidobacterium Lactis. No gums, thickeners, stabilizers, pectin, or added sugar.","sources":["https://www.strausfamilycreamery.com/products/greek-yogurt/organic-whole-plain-greek-yogurt/","https://www.wholefoodsmarket.com/product/straus-family-creamery-organic-plain-whole-milk-greek-yog ) and no sugar (Principle 4).","confidence":"medium","ingredients":"PLAIN skyr deck: Grade A Nonfat Milk, Live & Active Cultures (B. species, L. Acidophilus, L. Bulgaricus, L. Paracasei, S. Thermophilus). No added sugar, no gums, no starch.","sources":["https://www.centralmarket.com/product/central-market-17g-protein-icelandic-style-skyr-nonfat-yogurt-plain-53-oz/11984012","https://www.heb.com/product-detail/central-market-17g-protein-icelandic-style-skyr-nonfat-yogurt-plain/11984012","https://www.centralmarket.com/product/central-market-15g-protein-icelandic-style-skyr-nonfat-yogurt-vanilla-bean-53-oz/11982516"],"notes":"SKU DISCREPANCY: Central Market's PLAIN 5.3oz skyr is branded 17g protein (clean deck, verified). The '15g Protein' 5.3oz cups in this line are all FLAVORED/SWEETENED variants (Vanilla Bean, Spiced Peach, Strawberry Rhubarb) containing sugar/cassava starch/pectin. No genuine '15g plain' SKU appears to exist. Audited the plain skyr per the brief (name specifies no flavor). VERIFY IN-STORE: if the stocked item is actually a 15g flavored cup, it is DISQUALIFIED (added sugar, L2)."},{"id":12,"name":":ratio 25g Protein Dairy Snack","cat":"Yogurt","store":"heb","price":1.66,"gd":8.1,"decision":"disqualify","dqLevel":"L3","reason":"Multiple hard disqualifiers: Sucralose (synthetic sweetener), Erythritol (polyol), Carrageenan (gum, L3), and Sunflower Oil (industrial seed oil, L3).","justification":"A fully engineered ultra-processed product: carrageenan strips the mucin/tight-junction shield (Principle 1), sunflower-oil PUFAs introduce oxidized-lipid load (Principle 3), and sucralose/erythritol are non-nutritive sweeteners that disrupt the gut in bulking volumes.","confidence":"high","ingredients":"Cultured Pasteurized Ultra-Filtered Nonfat Milk, Milkfat, Avocado and/or Sunflower Oil, Whey Protein Concentrate; Contains 2% or less of: Sucralose, Erythritol, Natural Flavor, Carrageenan, Active Cultures. (Formulation/oil blend varies by lot/flavor.)","sources":["https://ratioyogurt.com/products/vanilla-protein-dairy-snack/","https://www.heb.com/product-detail/ratio-25g-protein-vanilla-dairy-snack/13014512","https://www.amazon.com/ratio-PROTEIN-Dairy-Snack-Vanilla/dp/B08L4YDD28"],"notes":"Flavor/oil blend varies (avocado and/or sunflower oil; some SKUs cited with gelatin), but ALL variants contain sucralose + carrageenan, so it disqualifies regardless of flavor. Original catalog flag 'seed' understated the multiple disqualifiers. Deck corroborated via brand site, H-E-B, Amazon (direct fetch blocked 403)."},{"id":1,"name":"Alexandre Family Farm A2 Organic 100% Grass-Fed Whole Milk Yogurt (Plain)","cat":"Yogurt","store":"wf","price":8.99,"gd":6.8,"decision":"tier1","dqLevel":null,"reason":"100% A2/A2 grass-fed whole-milk yogurt; clean 3-ingredient deck (milk, cream, cultures), zero added sugar, zero gums/thickeners, zero seed oils.","justification":"A2-only beta-casein avoids the BCM-7 peptide of A1 milk (Principle 2 native protein/peptide recognition), and the unadulterated non-homogenized whole-food fat matrix preserves mucosal integrity (Principle 1) with no glycemic load (Principle 4).","confidence":"high","ingredients":"Organic Milk, Organic Cream, Live & Active Cultures (S. Thermophilus, L. Bulgaricus, L. Lactis, L. Acidophilus, Bifidobacterium Lactis). 100% grass-fed, A2/A2 beta-casein, cream-top (non-homogenized), whole milk (~6% butterfat).","sources":["https://alexandrefamilyfarm.com/products/a2-a2-organic-100-grass-fed-yogurt","https://www.goodeggs.com/alexandrekids/organic-grass-fed-a2-a2-cream-on-top-yogurt/60ddf3cf368edd0012971b6c","https://www.amazon.com/ALEXANDRE-FAMILY-FARMS-Organic-Yogurt/dp/B0BDGNCC49"],"notes":"Brand explicitly markets verified A2/A2 genetics. Plain variant audited. Direct page fetch blocked (403 anti-bot); deck corroborated across brand site, Good Eggs and Amazon via search."},{"id":3,"name":"Bellwether Farms Plain Sheep Milk Yogurt","cat":"Yogurt","store":"heb","price":5.98,"gd":6.8,"decision":"tier1","dqLevel":null,"reason":"Sheep milk yogurt (naturally A2-type casein), clean 2-component deck (sheep milk + cultures), zero added sugar, zero gums/stabilizers/seed oils.","justification":"Sheep-milk casein is a native, well-tolerated A2-type protein matrix (Principle 2) with high mineral/protein density and no mucosal disruptors (Principle 1) or added sugar (Principle 4).","confidence":"high","ingredients":"Pasteurized Sheep Milk, Live Active Cultures: S. Thermophilus, L. Bulgaricus, L. Acidophilus & Bifidus.","sources":["https://bellwetherfarms.com/product/plain-sheep-milk-yogurt/","https://www.heb.com/product-detail/bellwether-farms-plain-sheep-milk-yogurt/1484670","https://www.amazon.com/BELLWETHER-FARMS-Plain-Sheep-Yogurt/dp/B08NGC4NM5"],"notes":"Plain variant audited. Direct fetch blocked (403); deck corroborated across brand site, H-E-B and Amazon via search."}];
const DEC={tier1:'Tier 1 · Gold',tier2:'Tier 2 · Staple',tier3:'Tier 3 · Fallback',disqualify:'Disqualified',delete_unverifiable:'Unverifiable'};
let filter='all', q='', catF='all';
const root=document.getElementById('root');
function counts(){const c={tier1:0,tier2:0,tier3:0,disqualify:0,delete_unverifiable:0};DATA.forEach(d=>c[d.decision]++);return c;}
function passes(d){
  if(catF!=='all'&&d.cat!==catF)return false;
  if(filter==='keep'&&!['tier1','tier2','tier3'].includes(d.decision))return false;
  if(filter==='del'&&!['disqualify','delete_unverifiable'].includes(d.decision))return false;
  if(['tier1','tier2','tier3','disqualify','delete_unverifiable'].includes(filter)&&d.decision!==filter)return false;
  if(q){const s=(d.name+' '+d.cat+' '+d.reason+' '+d.ingredients).toLowerCase();if(!s.includes(q))return false;}
  return true;
}
function render(){
  const c=counts(), keep=c.tier1+c.tier2+c.tier3, del=c.disqualify+c.delete_unverifiable;
  const cats=[...new Set(DATA.map(d=>d.cat))].sort();
  const rows=DATA.filter(passes);
  const groups={}; rows.forEach(d=>{(groups[d.cat]=groups[d.cat]||[]).push(d);});
  const chip=(id,lab,cls)=>`<button class="chip ${cls||''} ${filter===id?'on':''}" data-f="${id}">${lab}</button>`;
  let h=`<div class="top"><div class="wrap">
    <div class="brand"><span class="wordmark">PRANA</span><span class="tag">CATALOG RE-AUDIT · 341 PRODUCTS · INGREDIENT-VERIFIED</span></div>
    <div class="sub">Every product's real ingredient deck was checked online against the strict pre-filter + Sweetener Matrix. Review before deletion — disqualified &amp; unverifiable items will be removed from the catalog.</div>
    <div class="stats">
      <div class="stat tot"><div class="n">341</div><div class="l">Audited</div></div>
      <div class="stat keep"><div class="n">${keep}</div><div class="l">Kept · safe zone</div><div class="mini"><span>T1 ${c.tier1}</span><span>T2 ${c.tier2}</span><span>T3 ${c.tier3}</span></div></div>
      <div class="stat del"><div class="n">${del}</div><div class="l">To delete</div><div class="mini"><span>DQ ${c.disqualify}</span><span>Unverif ${c.delete_unverifiable}</span></div></div>
    </div>
    <div class="ctrls">
      <input class="search" id="q" placeholder="Search name, ingredient, reason…" value="${q.replace(/"/g,'&quot;')}">
      ${chip('all','All')}${chip('keep','Kept','keep')}${chip('del','Delete','del')}
      ${chip('tier1','T1')}${chip('tier2','T2')}${chip('tier3','T3')}${chip('disqualify','DQ','del')}${chip('delete_unverifiable','Unverif')}
      <select class="cat" id="catsel"><option value="all">All categories</option>${cats.map(ct=>`<option value="${ct}" ${catF===ct?'selected':''}>${ct}</option>`).join('')}</select>
    </div>
    <div class="legend">Stripe &amp; badge encode the verdict · confidence flags how solid the online ingredient sourcing was · click a row for the verified ingredient deck &amp; sources</div>
  </div></div><div class="wrap">`;
  if(!rows.length) h+='<div class="empty">No products match.</div>';
  Object.keys(groups).sort().forEach(cat=>{
    const g=groups[cat];
    h+=`<div class="grp"><div class="ghead"><h2>${cat}</h2><div class="rule"></div><div class="cnt">${g.length} shown</div></div>`;
    g.forEach(d=>{
      const srcs=(d.sources||[]).map(s=>`<a href="${s}" target="_blank" rel="noopener">${s}</a>`).join('');
      h+=`<div class="row ${d.decision}" data-id="${d.id}">
        <div class="stripe"></div>
        <div class="body">
          <div class="rtop"><span class="name">${d.name}</span><span class="badge b-${d.decision}">${DEC[d.decision]}${d.dqLevel?' · '+d.dqLevel:''}</span>${d.confidence?`<span class="conf ${d.confidence}">${d.confidence}</span>`:''}</div>
          <div class="meta">${d.cat} · ${(d.store||'').toUpperCase()} · $${(d.price||0).toFixed(2)}</div>
          <div class="reason">${d.reason||d.justification||''}</div>
          <div class="expand" data-toggle="${d.id}">▸ ingredient deck &amp; sources</div>
          <div class="det">
            ${d.ingredients?`<div class="k">Verified ingredients</div><div class="ing">${d.ingredients}</div>`:''}
            ${d.notes?`<div class="k">Notes</div><div class="ing">${d.notes}</div>`:''}
            ${srcs?`<div class="k">Sources</div>${srcs}`:''}
          </div>
        </div>
        <div class="gd">${(d.gd||0).toFixed(1)}<small>g/$</small></div>
      </div>`;
    });
    h+='</div>';
  });
  h+='</div>';
  root.innerHTML=h;
  document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();const p=e.target.selectionStart;render();const el=document.getElementById('q');el.focus();el.setSelectionRange(p,p);});
  document.getElementById('catsel').addEventListener('change',e=>{catF=e.target.value;render();});
  root.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;render();}));
  root.querySelectorAll('.expand').forEach(x=>x.addEventListener('click',()=>{x.closest('.row').classList.toggle('open');}));
}
render();
</script>
