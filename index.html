<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRANA — Clean-Eating Intelligence</title>
<meta name="description" content="PRANA — rank food by protein-per-dollar, filtered through a 4-level clean-eating evidence ladder.">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PRANA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png" sizes="256x256" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Self-hosted UI/label font — offline-proof, no runtime dependency */
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/JetBrainsMono-Regular.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/JetBrainsMono-Regular.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/JetBrainsMono-Bold.ttf') format('truetype')}
/* Display font (Archivo) loads from Google Fonts; to make it offline-proof too,
   drop archivo-600/700/800/900 woff2 into fonts/ and swap this for @font-face. */
:root{
  --bg:#0a090c; --body:#060506;
  --bone1:#efeee6; --bone2:#d6d3c7; --bone3:#c0bcae; --ink:#26241f;
  --copper:#cf9a4a; --copper-l:#e0be86; --copper-d:#8a6a2e;
  --crimson:#c85a54; --crimson-t:#e6c9c6;
  --sage:#93b39a; --sage-l:#a6c9ad;
  --peri:#b8c0e0;
  --mute:#7f7c89; --mute2:#8b8894; --mute3:#5f5c68;
  --line:#1f1d24; --line2:#2a2731;
  --t1:#e2dec9; --t2:#cf9a4a; --t3:#c85a54;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Archivo','Arial Narrow',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background-color:#0b0b0d}
body{font-family:var(--mono);color:#e9e7ef}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
::selection{background:rgba(207,154,74,.3)}
.statusbar,.notch,.sb-glyphs{display:none}
/* ---------- #device = the scroll container (locked to 100vh via html/body) ---------- */
#device{
  position:relative; width:100%; max-width:480px; height:100%; margin:0 auto;
  overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; box-sizing:border-box;
  background:var(--bg);
  padding-top:calc(env(safe-area-inset-top) + 14px);
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
#device::-webkit-scrollbar{display:none}
#app{overflow-x:hidden}
.pad{padding:0 18px;max-width:100%}
/* ---------- bottom nav (direct child of body, pinned to the physical bottom) ---------- */
.nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; z-index:9999;
  background:#0b0b0d; box-sizing:border-box; border-top:1px solid rgba(255,255,255,.06);
  display:flex; align-items:flex-start; justify-content:space-around;
  padding-top:10px; padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}
@media (max-width:520px), (display-mode:standalone){
  #device{max-width:none}
  .nav{max-width:none; left:0; right:0; transform:none}
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:9px;width:20%;padding-top:4px}
.nav .dot{width:7px;height:7px;border-radius:50%;background:transparent;transition:.25s}
.nav button.on .dot{background:var(--copper);box-shadow:0 0 10px 1px rgba(207,154,74,.8)}
.nav .lab{font-size:10px;letter-spacing:2.5px;color:var(--mute3);font-weight:500}
.nav button.on .lab{color:var(--t1)}

/* ---------- typography helpers ---------- */
.disp{font-family:var(--disp);font-weight:900;letter-spacing:-.02em;line-height:.9}
.kicker{font-size:10px;letter-spacing:3px;color:var(--mute);font-weight:500}
.wordmark{font-family:var(--disp);font-weight:900;letter-spacing:9px;font-size:34px;text-align:center;color:#f0eee6}
.subword{text-align:center;font-size:9px;letter-spacing:3px;color:var(--mute3);margin-top:8px}
.h-title{font-family:var(--disp);font-weight:800;letter-spacing:3px;text-align:center;font-size:21px;color:#f0eee6}
.h-sub{text-align:center;font-size:9.5px;letter-spacing:2px;color:var(--mute3);margin-top:6px}
.big-num{font-family:var(--disp);font-weight:900;letter-spacing:-.03em}

/* ---------- generic cards ---------- */
.card{background:linear-gradient(180deg,#141218,#0e0c11);border:1px solid var(--line2);border-radius:22px}
.porcelain{background:linear-gradient(160deg,var(--bone1),var(--bone2) 55%,var(--bone3));color:var(--ink);
  box-shadow:0 18px 40px -20px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.5)}
.slate{background:linear-gradient(160deg,#54545e,#2f2f36 55%,#1b1b21);border:1px solid rgba(207,154,74,.28)}
.pill{border-radius:999px}
.tag{font-size:9.5px;letter-spacing:2px;font-weight:700;padding:5px 11px;border-radius:8px;display:inline-block}
.tag.t1{background:rgba(226,222,201,.14);color:var(--t1);border:1px solid rgba(226,222,201,.3)}
.tag.onbone{background:rgba(38,36,31,.10);color:#3b382f;border:1px solid rgba(38,36,31,.28)}
.tag.t2{background:rgba(207,154,74,.16);color:var(--copper-l);border:1px solid rgba(207,154,74,.4)}
.tag.t3{background:rgba(200,90,84,.16);color:var(--crimson-t);border:1px solid rgba(200,90,84,.42)}
.dot-t{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.band-el{color:var(--sage)} .band-st{color:var(--copper-l)} .band-fa{color:var(--mute2)} .band-lo{color:#b98a86}
.bar{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sage),var(--sage-l));transition:width .5s cubic-bezier(.2,.9,.25,1.1)}

/* HOME */
.rocker{display:flex;gap:6px;background:#0e0c12;border:1px solid var(--line2);border-radius:16px;padding:6px;flex:1}
.rocker button{flex:1;font-size:10px;letter-spacing:1.5px;font-weight:700;padding:11px 4px;border-radius:11px;color:var(--mute2);transition:.2s}
.rocker button.on{background:linear-gradient(160deg,#3a3942,#232228);color:#efeee6;border:1px solid rgba(207,154,74,.5);box-shadow:0 4px 12px -6px #000}
.mic{width:54px;height:54px;border-radius:16px;background:linear-gradient(160deg,#1a1820,#100e14);border:1px solid rgba(207,154,74,.45);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.icon-btn{width:54px;height:54px;border-radius:16px;background:linear-gradient(160deg,var(--bone1),var(--bone3));color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex:0 0 auto}
.row-item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;background:linear-gradient(180deg,#131117,#0d0b11);border:1px solid var(--line2);width:100%;text-align:left}
.row-item.hl{border-color:rgba(207,154,74,.55);background:linear-gradient(180deg,rgba(207,154,74,.10),rgba(207,154,74,.02))}

/* QUEUE */
.deck{position:relative;height:400px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.qcard{position:absolute;width:280px;border-radius:26px;padding:26px 24px;will-change:transform}
.stamp{position:absolute;top:26px;font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:2px;
  padding:6px 16px;border:3px solid;border-radius:12px;opacity:0;transition:opacity .1s}
.stamp.ag{right:20px;color:var(--sage);border-color:var(--sage);transform:rotate(12deg)}
.stamp.di{left:20px;color:var(--crimson);border-color:var(--crimson);transform:rotate(-12deg)}
.qbtn{flex:1;padding:16px 8px;border-radius:16px;font-weight:700;letter-spacing:1.5px;font-size:12px;text-align:center}
.qbtn.dis{background:rgba(200,90,84,.10);border:1px solid rgba(200,90,84,.45);color:var(--crimson-t)}
.qbtn.ins{background:#1a1820;border:1px solid var(--line2);color:var(--mute2)}
.qbtn.ag{background:linear-gradient(160deg,var(--bone1),var(--bone3));color:var(--ink)}

/* RANK */
.chips{display:flex;gap:8px;justify-content:center}
.chip{font-size:11px;letter-spacing:2px;font-weight:700;padding:9px 18px;border-radius:12px;border:1px solid var(--line2);color:var(--mute2)}
.chip.on{border-color:var(--copper);color:var(--copper-l);background:rgba(207,154,74,.10)}
.flow{position:relative;margin-top:10px;height:214px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  perspective:1150px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:0 calc(50% - 79px);scrollbar-width:none}
.flow::-webkit-scrollbar{display:none}
.fcard{scroll-snap-align:center;scroll-snap-stop:always;flex:0 0 158px;width:158px;min-width:0;height:186px;margin:0;border-radius:22px;padding:16px 14px;
  display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;backface-visibility:hidden;
  box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.ptr{text-align:center;color:var(--copper);font-size:15px;margin-top:2px}

/* DATA */
.search{width:100%;background:#0e0c12;border:1px solid var(--line2);border-radius:16px;padding:15px 16px 15px 42px;color:#e9e7ef;font-size:16px}
.searchwrap{position:relative}
.searchwrap:before{content:"⌕";position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute3);font-size:18px}
.selbtn{flex:1;background:#0e0c12;border:1px solid var(--line2);border-radius:16px;padding:16px;text-align:left;color:#cfccd7;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.statbox{flex:1;background:linear-gradient(180deg,#121016,#0c0a10);border:1px solid var(--line2);border-radius:16px;padding:14px 8px;text-align:center}
.statbox .n{font-family:var(--disp);font-weight:900;font-size:26px}
.statbox .l{font-size:8.5px;letter-spacing:2px;color:var(--mute3);margin-top:3px}
.drow{display:flex;align-items:center;gap:11px;padding:14px;border-radius:16px;background:linear-gradient(180deg,#111015,#0c0b10);border:1px solid var(--line2)}
.mini-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px;color:var(--mute2)}
.mini-btn.add{border-color:rgba(207,154,74,.45);color:var(--copper)}
.mini-btn.in{border-color:rgba(147,179,154,.5);color:var(--sage);background:rgba(147,179,154,.08)}
.catmenu{overflow:hidden;transition:max-height .32s cubic-bezier(.2,.9,.25,1.1);max-height:0}
.catmenu.open{max-height:420px}
.catrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.cbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--mute3);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px}
.cbox.on{background:var(--copper);border-color:var(--copper);color:#1a1206}

/* LIST */
.grouptag{font-size:11px;letter-spacing:2.5px;font-weight:700;padding:7px 14px;border-radius:10px;display:inline-block}
.gt-heb{background:rgba(207,154,74,.12);color:var(--copper-l);border:1px solid rgba(207,154,74,.4)}
.gt-wf{background:rgba(147,179,154,.12);color:var(--sage-l);border:1px solid rgba(147,179,154,.4)}
.gt-other{background:rgba(184,192,224,.12);color:var(--peri);border:1px solid rgba(184,192,224,.4)}
.lpill{display:flex;align-items:center;gap:10px;padding:8px 13px;border-radius:13px;background:linear-gradient(180deg,#121016,#0c0b10);border:1px solid var(--line2)}
.pname{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;font-weight:500;letter-spacing:0}
.lpill.oos{border-color:rgba(200,90,84,.55)}
.xrm{width:44px;height:44px;margin:-7px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--mute3);font-size:16px;flex:0 0 auto}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.swap{overflow:hidden;max-height:0;transition:max-height .32s ease}
.swap.open{max-height:300px}

/* overlays */
.backdrop{position:fixed;inset:0;z-index:10000;background:rgba(4,3,6,.62);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;margin:0 auto;max-width:440px;bottom:0;z-index:10001;max-height:90%;overflow-y:auto;
  background:linear-gradient(180deg,#151319,#0c0b10);border:1px solid var(--line2);border-bottom:none;
  border-radius:28px 28px 0 0;padding:22px 20px calc(30px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.25,1.1)}
.sheet.show{transform:translateY(0)}
.sheet::-webkit-scrollbar{display:none}
.grab{width:42px;height:5px;border-radius:3px;background:#33313a;margin:0 auto}
/* sticky top bar on every sheet — guarantees a visible exit no matter how tall the content */
.sheettop{position:sticky;top:-22px;z-index:6;display:flex;align-items:center;justify-content:center;
  margin:-22px -20px 12px;padding:16px 20px 8px;background:#151319;border-radius:28px 28px 0 0}
.sheetx{position:absolute;right:12px;top:11px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);
  background:#0e0c12;color:#cfccd7;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheetx:active{background:#1a1820}
.tile{flex:1;background:#0e0c12;border:1px solid var(--line2);border-radius:16px;padding:15px}
.ladder{border:1px solid var(--line2);border-radius:16px;padding:15px;margin-top:9px;background:#0d0b11}
.lvl-pass{color:var(--sage)} .lvl-fail{color:var(--crimson)} .lvl-flag{color:var(--copper-l)} .lvl-idle{color:var(--mute3)}
.field{width:100%;background:#0e0c12;border:1px solid var(--line2);border-radius:13px;padding:13px 14px;color:#e9e7ef;font-size:16px;margin-top:7px}
.fchip{font-size:10px;letter-spacing:.5px;font-weight:700;padding:9px 12px;border-radius:11px;border:1px solid var(--line2);color:var(--mute2)}
.fchip.on{border-color:var(--copper);color:var(--copper-l);background:rgba(207,154,74,.10)}
.btn-bone{background:linear-gradient(160deg,var(--bone1),var(--bone3));color:var(--ink);font-weight:700;letter-spacing:1px;padding:15px;border-radius:15px;text-align:center;width:100%}
.btn-ghost{background:#141218;border:1px solid var(--line2);color:#cfccd7;font-weight:700;letter-spacing:1px;padding:15px;border-radius:15px;text-align:center;width:100%}
.mic-halo{width:120px;height:120px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:44px;
  background:radial-gradient(circle,rgba(207,154,74,.18),transparent 70%);position:relative;border:none;cursor:pointer;transition:background .25s}
.mic-halo:before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(207,154,74,.28)}
.mic-halo.live{background:radial-gradient(circle,rgba(207,154,74,.44),transparent 70%)}
.mic-halo.live:before{border-color:rgba(207,154,74,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(207,154,74,.18);border-top-color:var(--copper);animation:spin .9s linear infinite;margin:14px auto}
.note{font-size:11px;color:var(--mute);text-align:center;line-height:1.6}
.reduce *{animation:none!important;transition:none!important}
a.link{color:var(--copper-l);text-decoration:none;border-bottom:1px solid rgba(207,154,74,.35)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);z-index:10002;
  background:#1a1820;border:1px solid rgba(207,154,74,.5);color:#efeee6;padding:11px 18px;border-radius:12px;font-size:12px;
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:88%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hr{height:1px;background:var(--line2);margin:22px 0}
</style>
</head>
<body>
<main id="device"><div id="app"></div></main>
<nav class="nav" id="nav"></nav>
<div id="overlays"></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
/* =====================================================================
   PRANA — single-file clean-eating intelligence app
   ===================================================================== */
window.onerror=function(m,s,l,c,e){ try{console.error('PRANA',(e&&e.stack)||m,'@',l+':'+c);}catch(_){} };
const D = window.PRANA_DATA;
const RAW = D.products;
const CATS_BASE = D.cats;
const MECH = D.mech, CLEANNOTES = D.cleanNotes, SCIENCE = D.science, CAT_EMOJI = D.catEmoji;
const PROTEIN_TARGET = 160;              // fallback if no weight set
const PROTEIN_PER_KG = 2.0;              // clean-bulk hypertrophy target (doc: 1.6–2.2 g/kg)
function targetProtein(){ return S.proteinTarget>0 ? S.proteinTarget : PROTEIN_TARGET; }
const STORE_LABEL = {heb:'H·E·B', wf:'WHOLE FOODS', other:'ONLINE / DIRECT'};
const STORE_SHORT = {heb:'H·E·B', wf:'WHOLE FOODS', other:'ONLINE'};

/* ---------- persistence ---------- */
const PKEY='prana.appdata.v1';
const DEFAULT = {
  screen:'home', stores:['heb','wf','other'], dailyProtein:0, log:[],
  listIds:[], outStock:{}, overrides:{}, decisions:{}, history:[], qIndex:0,
  ingested:[], rankTier:'ALL', dbCats:[], dbSort:'gd', dbQuery:'',
  catExtra:[], prodEdits:{}, prodAdds:[], prodDeleted:[],
  reduceMotion:false, proteinTarget:160, weightLb:0,
  recipes:[], shopping:[], cookTab:'recipes', lastBackup:0,
  macros:{calories:false,carbs:false,fat:false},   // protein is always tracked; these are opt-in
  remind:{on:false,hour:19,lastNudge:''}, workerUrl:'',
  gdriveClientId:'', gdrive:{connected:false,fileId:'',lastSync:0}
};
let S = load();
function load(){
  let s;
  try{ const j=JSON.parse(localStorage.getItem(PKEY)); if(j&&j._p) s=Object.assign({}, DEFAULT, j); }catch(e){}
  // No demo/seed data: the app starts empty. Only the real verified catalog exists;
  // list/queue/log are all user-built.
  if(!s) s=Object.assign({}, DEFAULT);
  if(!Array.isArray(s.log)) s.log=[];
  if(!s.macros||typeof s.macros!=='object') s.macros={calories:false,carbs:false,fat:false};
  if(!s.remind||typeof s.remind!=='object') s.remind={on:false,hour:19,lastNudge:''};
  if(!s.gdrive||typeof s.gdrive!=='object') s.gdrive={connected:false,fileId:'',lastSync:0};
  // one-time migration: fold a legacy single-number daily total into the itemised log
  if(s.dailyProtein>0 && !s.log.some(e=>e.date===today())){
    s.log.push({id:'seed'+Date.now(), name:'Earlier today', detail:'carried over', protein:Math.round(s.dailyProtein), date:today(), ts:Date.now()});
  }
  s.dailyProtein=0;   // superseded by the log; kept only so old backups still import
  return s;
}
/* ---------- daily protein + macro log ---------- */
const MACRO_KEYS=['calories','carbs','fat'];
const MACRO_META={calories:{label:'Calories',short:'KCAL',unit:''}, carbs:{label:'Carbs',short:'CARBS',unit:'g'}, fat:{label:'Fat',short:'FAT',unit:'g'}};
function today(){ return new Date().toISOString().slice(0,10); }
function logToday(){ return S.log.filter(e=>e.date===today()); }
function daySum(field, date){ const d=date||today(); return S.log.filter(e=>e.date===d).reduce((s,e)=>s+(+e[field]||0),0); }
function dayProtein(date){ return daySum('protein', date); }
function anyMacroOn(){ return MACRO_KEYS.some(k=>S.macros[k]); }
function enabledMacros(){ return MACRO_KEYS.filter(k=>S.macros[k]); }
function toggleMacro(k){ S.macros[k]=!S.macros[k]; save(); renderOverlay(); render(); }
// macros carries any of {calories,carbs,fat}; values are captured even when a macro is toggled off,
// so turning it on later still shows the history.
function addLogEntry(name, protein, detail, macros){
  const p=Math.max(0,Math.round(+protein||0)); const m=macros||{};
  S.log.push({id:'l'+Date.now()+'_'+Math.floor(Math.random()*1e4), name:(name||'Item').toString().trim()||'Item', detail:detail||'',
    protein:p, calories:Math.max(0,Math.round(+m.calories||0)), carbs:Math.max(0,Math.round(+m.carbs||0)), fat:Math.max(0,Math.round(+m.fat||0)),
    date:today(), ts:Date.now()});
}
function delLogEntry(id){ S.log=S.log.filter(e=>e.id!==id); renderOverlay(); render(); }

/* =====================================================================
   DURABILITY — recipe images live in IndexedDB (not the tiny localStorage),
   storage is asked to persist, and a rolling backup keeps data recoverable.
   ===================================================================== */
let IMG={}, _db=null, _idbOk=false, _storeEst=null;
function idbOpen(){ return new Promise(res=>{ try{
    if(!('indexedDB' in window)){ return res(null); }
    const rq=indexedDB.open('prana',1);
    rq.onupgradeneeded=()=>{ const db=rq.result; if(!db.objectStoreNames.contains('images')) db.createObjectStore('images'); };
    rq.onsuccess=()=>{ _db=rq.result; _idbOk=true; res(_db); };
    rq.onerror=()=>{ _idbOk=false; res(null); };
  }catch(e){ _idbOk=false; res(null); } }); }
function idbPut(k,v){ return new Promise(r=>{ if(!_db)return r(false); try{ const t=_db.transaction('images','readwrite'); t.objectStore('images').put(v,k); t.oncomplete=()=>r(true); t.onerror=()=>r(false);}catch(e){r(false);} }); }
function idbDel(k){ return new Promise(r=>{ if(!_db)return r(false); try{ const t=_db.transaction('images','readwrite'); t.objectStore('images').delete(k); t.oncomplete=()=>r(true); t.onerror=()=>r(false);}catch(e){r(false);} }); }
function idbAll(){ return new Promise(r=>{ if(!_db)return r({}); try{ const t=_db.transaction('images','readonly'); const st=t.objectStore('images'), out={}; const c=st.openCursor();
    c.onsuccess=e=>{ const cur=e.target.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else r(out); }; c.onerror=()=>r(out);}catch(e){r({});} }); }
// image accessor used everywhere a recipe photo is shown
function recipeImg(r){ if(!r) return ''; return (IMG[r.id]!=null?IMG[r.id]:(r.image||'')); }
// write/clear a recipe's image: prefer IDB, fall back to inline on the record
function setRecipeImage(rec, dataUrl){
  if(dataUrl){ if(_idbOk){ IMG[rec.id]=dataUrl; idbPut(rec.id,dataUrl); rec.image=''; rec.hasImage=true; } else { rec.image=dataUrl; rec.hasImage=true; } }
  else { delete IMG[rec.id]; if(_idbOk) idbDel(rec.id); rec.image=''; rec.hasImage=false; }
}
async function hydrateImages(){
  if(_idbOk){ IMG=await idbAll(); }
  // migrate any legacy inline base64 out of localStorage into IDB
  let moved=false;
  (S.recipes||[]).forEach(r=>{ if(r.image && String(r.image).slice(0,5)==='data:'){ IMG[r.id]=r.image; r.hasImage=true; if(_idbOk){ idbPut(r.id,r.image); r.image=''; moved=true; } } });
  if(moved) save();
}
/* rolling backup — one month-named file, complete with images */
function collectBackup(){ const o=Object.assign({app:'PRANA',version:2,exportedAt:new Date().toISOString()},S); o.images=IMG; return o; }
function downloadJSON(obj, filename){ const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function backupNow(){ const d=new Date(); const mm=d.toISOString().slice(0,7); // YYYY-MM → one rolling file per month
  downloadJSON(collectBackup(), 'prana-backup-'+mm+'.json'); S.lastBackup=Date.now(); save(); render(); toast('Backup saved · prana-backup-'+mm+'.json'); }
function backupDue(){ return !S.lastBackup || (Date.now()-S.lastBackup) > 14*864e5; }
function lastBackupLabel(){ if(!S.lastBackup) return 'never backed up'; const days=Math.floor((Date.now()-S.lastBackup)/864e5);
  return days<=0?'backed up today':('backed up '+days+' day'+(days===1?'':'s')+' ago'); }
function storageBytes(){ let ls=0; try{ ls=JSON.stringify(S).length; }catch(e){} let img=0; for(const k in IMG){ img+=(IMG[k]?IMG[k].length:0); } return {ls,img,total:ls+img}; }
function fmtKB(n){ return n<1024?n+' B':(n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'); }
function refreshStorageEstimate(){ try{ if(navigator.storage&&navigator.storage.estimate){ navigator.storage.estimate().then(e=>{ _storeEst=e; }); } }catch(e){} }

/* =====================================================================
   GOOGLE DRIVE — optional true hands-off cloud backup. After a one-time
   consent, the app silently uploads a single rolling file (overwritten in
   place) whenever a backup is due and the app is open. Needs the user's own
   OAuth Client ID (public, not a secret); see worker/GDRIVE_SETUP.md.
   All calls no-op gracefully when GIS isn't loaded or no client ID is set.
   ===================================================================== */
let _gis=null, _gToken='', _gTokenExp=0, _gisLoading=null;
const DRIVE_FILENAME='prana-backup.json';
function driveConfigured(){ return !!(S.gdriveClientId||'').trim(); }
function loadGIS(){ if(_gisLoading) return _gisLoading;
  _gisLoading=new Promise((res,rej)=>{ try{
    if(window.google&&google.accounts&&google.accounts.oauth2){ _gis=google.accounts.oauth2; return res(_gis); }
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
    s.onload=()=>{ try{ _gis=google.accounts.oauth2; res(_gis); }catch(e){ rej(e); } };
    s.onerror=()=>rej(new Error('GIS load failed')); document.head.appendChild(s);
  }catch(e){ rej(e); } }); return _gisLoading; }
// get an access token; prompt:'' = silent (only works after prior consent)
function driveToken(prompt){ return new Promise((res,rej)=>{
  if(_gToken && Date.now()<_gTokenExp-60000) return res(_gToken);
  loadGIS().then(gis=>{ try{
    const tc=gis.initTokenClient({ client_id:(S.gdriveClientId||'').trim(), scope:'https://www.googleapis.com/auth/drive.file',
      callback:(resp)=>{ if(resp&&resp.access_token){ _gToken=resp.access_token; _gTokenExp=Date.now()+(+resp.expires_in||3600)*1000; res(_gToken); } else rej(new Error('no token')); },
      error_callback:(e)=>rej(e||new Error('auth error')) });
    tc.requestAccessToken({prompt: prompt==null?'consent':prompt});
  }catch(e){ rej(e); } }).catch(rej); }); }
async function driveUpload(){ const token=await driveToken(S.gdrive.connected?'':'consent');
  const body=JSON.stringify(collectBackup());
  const meta={name:DRIVE_FILENAME, mimeType:'application/json'};
  if(S.gdrive.fileId){ // overwrite the same file (media update) → single rolling file
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(S.gdrive.fileId)+'?uploadType=media',
      {method:'PATCH', headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}, body});
    if(res.status===404){ S.gdrive.fileId=''; return driveUpload(); } // file was deleted — recreate
    if(!res.ok) throw new Error('drive update '+res.status);
  } else { // create once (multipart: metadata + media)
    const boundary='pranab'+Math.random().toString(36).slice(2);
    const multipart='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
      '\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+boundary+'--';
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {method:'POST', headers:{'Authorization':'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary}, body:multipart});
    if(!res.ok) throw new Error('drive create '+res.status);
    const j=await res.json(); S.gdrive.fileId=j.id;
  }
  S.gdrive.connected=true; S.gdrive.lastSync=Date.now(); S.lastBackup=Date.now(); save(); return true;
}
function connectDrive(){ if(!driveConfigured()){ toast('Paste your Google client ID first'); return; }
  toast('Opening Google sign-in…');
  driveUpload().then(()=>{ render(); toast('Google Drive connected · backed up'); })
    .catch(e=>{ toast('Drive connect failed — check the client ID & origin'); }); }
function driveBackupNow(){ if(!driveConfigured()) return;
  driveUpload().then(()=>{ render(); toast('Backed up to Google Drive'); }).catch(()=>toast('Drive backup failed — reconnect')); }
function disconnectDrive(){ try{ if(_gToken&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(_gToken,()=>{}); }catch(e){}
  _gToken=''; _gTokenExp=0; S.gdrive={connected:false,fileId:'',lastSync:0}; save(); render(); toast('Google Drive disconnected'); }
function driveLastSyncLabel(){ if(!S.gdrive.lastSync) return 'not synced yet'; const days=Math.floor((Date.now()-S.gdrive.lastSync)/864e5);
  return days<=0?'synced today':('synced '+days+'d ago'); }
// on open, if connected and a backup is due, silently upload (no tap after first consent)
async function driveAutoSync(){ if(!driveConfigured()||!S.gdrive.connected||!backupDue()) return;
  try{ await driveUpload(); render(); }catch(e){ /* silent token expired — user will reconnect */ } }

/* ---------- live product composition ---------- */
function products(){
  const del = new Set(S.prodDeleted);
  let list = RAW.filter(p=>!del.has(p.id)).map(p=>{
    const e = S.prodEdits[p.id]; return e? Object.assign({}, p, e) : p;
  });
  list = list.concat(S.prodAdds);
  return list.map(withMetrics);
}
function withMetrics(p){
  const pg = (p.protein||0)*(p.servings||0);
  const gd = Math.round((pg/Math.max(.01,p.price))*10)/10;
  const cpg = pg>0 ? p.price/pg : Infinity;
  return Object.assign({}, p, {gd, cpg, band:bandOf(gd), effTier:S.overrides[p.id]?1:p.tier});
}
function bandOf(g){ return g>=12?['ELITE','band-el']:g>=6?['STRONG','band-st']:g>=2.5?['FAIR','band-fa']:['LOW','band-lo']; }

function decide(kind){

  S.history.push({id:top.id, idx:S.qIndex, kind, added:willAdd});

  if(willAdd) S.listIds.push(top.id);
  S.qIndex++;
  render();
}
function undoDecision(){
  const h=S.history.pop(); if(!h) return;

/* queue drag */
let _qMove=null,_qUp=null;
function bindQueue(){
  if(_qMove){ window.removeEventListener('pointermove',_qMove); window.removeEventListener('pointerup',_qUp); _qMove=_qUp=null; }
  const card=document.getElementById('topcard'); if(!card||S.reduceMotion) return;
  let sx=0,sy=0,dx=0,drag=false,moved=false;
  const A=document.getElementById('stampA'),Dm=document.getElementById('stampD');
  const down=e=>{drag=true;moved=false;const p=pt(e);sx=p.x;sy=p.y;card.style.transition='none';};
  const move=e=>{ if(!drag)return; const p=pt(e); dx=p.x-sx; const dy=p.y-sy;
    if(Math.abs(dx)>6)moved=true;
    card.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx*.05}deg)`;
    if(A)A.style.opacity=dx>40?Math.min(1,(dx-40)/60):0;
    if(Dm)Dm.style.opacity=dx<-40?Math.min(1,(-dx-40)/60):0; };
  const up=()=>{ if(!drag)return; drag=false;
    card.style.transition='transform .33s cubic-bezier(.2,.9,.25,1.1)';
    if(dx>96){ card.style.transform=`translate(500px,0) rotate(24deg)`; setTimeout(()=>decide('accept'),240); }
    else if(dx<-96){ card.style.transform=`translate(-500px,0) rotate(-24deg)`; setTimeout(()=>decide('discard'),240); }
    else { card.style.transform=''; if(A)A.style.opacity=0; if(Dm)Dm.style.opacity=0;
      if(!moved) openDrawer(queueList()[S.qIndex].id); }
    dx=0; };
  _qMove=move; _qUp=up;
  card.addEventListener('pointerdown',down); window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
}
function pt(e){ const t=e.touches&&e.touches[0]; return {x: e.clientX!=null?e.clientX:(t?t.clientX:0), y: e.clientY!=null?e.clientY:(t?t.clientY:0)}; }

// smooth-scroll a tapped card to center (fan restyles live via onscroll)
function flowTo(i){ const flow=document.getElementById('flow'); const c=flow&&flow.children[i]; if(!c) return;
  flow.scrollTo({left:c.offsetLeft-(flow.clientWidth-c.clientWidth)/2, behavior:S.reduceMotion?'auto':'smooth'}); }
let _flowRaf=0,_flowSnapT=null;
function bindFlow(){
  const flow=document.getElementById('flow'); if(!flow) return;
  const cards=[...flow.children]; if(!cards.length) return;
  // cache card centers once (no per-frame layout reads)
  const centers=cards.map(c=>c.offsetLeft+c.clientWidth/2);
  const cw=cards[0].clientWidth;
  const step=(centers[1]!=null?centers[1]-centers[0]:cw)||cw;
  // center the selected card instantly
  flow.scrollLeft = centers[flowSel] - flow.clientWidth/2;
  const styleCards=()=>{
    const mid=flow.scrollLeft + flow.clientWidth/2;
    for(let i=0;i<cards.length;i++){
      const off=(centers[i]-mid)/step; const a=Math.abs(off);
      const c=cards[i];
      if(a>4){ if(c.style.visibility!=='hidden')c.style.visibility='hidden'; continue; }
      c.style.visibility='visible';
      const ry=Math.max(-2,Math.min(2,off))*-42;
      // translateX pulls neighbors toward center for a tight fan while each card
      // still occupies a full scroll slot (so swiping advances one card, not five)
      c.style.transform=`translateX(${-off*86}px) rotateY(${ry}deg) translateZ(${-a*95}px) scale(${Math.max(.6,1-a*.1)})`;
      c.style.opacity=String(Math.max(0,1-a*.28));
      c.style.zIndex=String(300-Math.round(a*12));
    }
  };
  styleCards();
  flow.onscroll=()=>{
    if(!_flowRaf) _flowRaf=requestAnimationFrame(()=>{_flowRaf=0;styleCards();});
    clearTimeout(_flowSnapT); _flowSnapT=setTimeout(()=>{
      const mid=flow.scrollLeft + flow.clientWidth/2; let best=0,bd=1e9;
      for(let i=0;i<centers.length;i++){ const d=Math.abs(centers[i]-mid); if(d<bd){bd=d;best=i;} }
      if(best!==flowSel){ flowSel=best; refreshRankSel(); }
    }, 90);
  };
}

/* EVIDENCE DRAWER
   The audit is the LOGIC: five universal, category-agnostic biological principles.
   Protein-per-dollar is the ranking metric (shown in the tiles) — it is NOT a
   pass/fail rule and is deliberately kept out of this audit. */
function principlesAudit(p){
  const over=!!S.overrides[p.id];
  const flags=new Set(p.flags);
  const t=over?1:p.effTier;
  // Every product in the catalog has already CLEARED the strict pre-filter — anything
  // carrying seed oils, synthetic emulsifiers/gums, dyes, trans fat or hidden savory
  // sugar was disqualified and removed. So no principle here is ever a hard ✕ FAIL;
  // the audit only distinguishes Tier-1 (all pass) from the Tier-2/3 trade-offs (▲ FLAG).
  const bite=f=> !over && flags.has(f);
  const A=[];
  A.push({t:'01 · MUCOSAL SHIELDING', s:'pass',
    d:'No synthetic emulsifiers, gums, polysorbates or carrageenan — the intestinal barrier stays intact. (Any item carrying them was filtered out of the catalog.)'});
  { const s= bite('tool')?'flag':'pass';       // engineered isolate caps at Tier 2 — a flag, never a hard fail
    A.push({t:'02 · PROTEIN NATIVE STATE', s,
      d: s==='flag'?'A clean protein isolate / concentrate (no gums, no sweeteners, no fillers) rather than a whole-food matrix — safe and macro-dense, but extracted, not native. Caps the item at Tier 2.'
        :'Whole-food protein in its native (or fermented / A2 pre-digested) matrix — cleaved cleanly, no inflammatory peptide fragments.'}); }
  A.push({t:'03 · LIPID STABILITY', s:'pass',
    d:'No refined seed oils or trans fats — only oxidatively stable, structurally intact lipids (EVOO, avocado oil, grass-fed dairy fat, cocoa butter). (Seed-oil items were filtered out.)'});
  { const s= bite('sugar')?'flag':'pass';
    A.push({t:'04 · GLYCEMIC INFLUX', s,
      d: s==='flag'?'Carries added sweetener — but only in an inherently-sweet category (chocolate, dessert, jam, cookie) and cleared by the Sweetener Matrix: whole fruit, raw honey, pure maple, unrefined cane or allulose only — never synthetic sweeteners or polyols. Not the savory-staple disqualifier.'
        :'No hidden added sugar in a savory or staple item — no rapid hepatic fructose flood. (Savory items with added sugar were filtered out.)'}); }
  A.push({t:'05 · ENZYMATIC PRE-DIGESTION', s: t===1?'pass':'flag',
    d: t===1?'Biologically pre-digested — long fermentation, wild culturing or sprouting has attenuated FODMAPs and antinutrients before you eat it.'
      : 'Clean and safe, but fast-tracked — skips the long-ferment / sprouting / A2 / raw-aged step that gives Tier 1 its pre-digestive edge. Still a fully buyable pick.'});
  return A;
}

function toggleOverride(id){ if(S.overrides[id]) delete S.overrides[id]; else S.overrides[id]=true; renderOverlay(); render(); }
/* catalog freshness — verified-date + one-tap re-verify (re-runs the science on stored ingredients) */
const STALE_DAYS=180;
function isStale(p){ return !!p.verifiedAt && (Date.now()-p.verifiedAt) > STALE_DAYS*864e5; }
function verifiedLabel(p){ if(!p.verifiedAt) return ''; const days=Math.floor((Date.now()-p.verifiedAt)/864e5);
  if(days<=0) return 'verified today'; if(days<7) return 'verified '+days+'d ago'; if(days<60) return 'verified '+Math.floor(days/7)+'w ago'; return 'verified '+Math.floor(days/30)+'mo ago'; }
function reVerify(id){ const p=byId(id); if(!p) return;
  if(!(p.ingr||'').trim()){ toast('No stored ingredients — deep re-verify needs the web-fetch service'); return; }
  const c=classify(p.name, p.cat, p.ingr);
  if(c.decision==='disqualify'){ showDisqualified({name:p.name,cat:p.cat,dqLevel:c.dqLevel,reason:c.reason,ingredient:c.ingredient,pending:Object.assign({},p),pendingId:id}); return; }
  const patch={tier:c.tier, flags:[c.flag], conf:'medium', verifiedAt:Date.now(),
    audit:c.reason+' Tag: '+({1:'Gold Standard · Whole-Food Clean',2:'Practical Clean Tool (Tier 2)',3:'Acceptable Safe Fallback (Tier 3)'}[c.tier])+'.',
    tlabel:({1:'Gold Standard',2:'Clean Tool',3:'Safe Fallback'}[c.tier])||'Clean Tool'};
  if(S.prodAdds.some(x=>x.id===id)) S.prodAdds=S.prodAdds.map(x=>x.id===id?Object.assign({},x,patch):x);

  const cm=low.match(/(?:to|in|under)\s+(?:the\s+|my\s+)?([a-z& ]+?)\s*(?:category|categories|,|$)/);
  if(cm){ const guess=cm[1].trim(); const found=allCats().find(c=>{ const cl=c.toLowerCase(); return cl===guess||cl.includes(guess)||guess.includes(cl); }); if(found) cat=found; }
  let name=namePart
    .replace(/^\s*(please\s+)?(add|create|save|register)\s+(a\s+|an\s+|the\s+)?(new\s+)?(product|item)?\s*/i,'')
    .replace(/\bto (the |my )?(catalog|catalogue|database)\b/ig,'')

    .replace(/\b(to|in|under) (the |my )?[a-z& ]+? (category|categories)\b/ig,'')
    .replace(/\s+(to|in|under)\s+(the |my )?[a-z& ]+?\s*,?\s*$/i,'')   // trailing "to <category>[,]" with no "category" word
    .replace(/[,.\s]+$/,'').trim();
  if(!name) name='New product';
  const d=blankFood(); d.name=name; d.store=store; d.stores=[store]; d.cat=cat; d.ingr=ingr;
  OV={kind:'edit', id:null, data:d, fromVoice:true};

}

/* =====================================================================
   SCIENCE CLASSIFIER — client-side implementation of the strict pre-filter
   + Sweetener Matrix (docs/CATEGORIZATION_LOGIC.md). Given name + category +
   raw ingredient text it returns {decision, dqLevel, reason, ingredient, flag,
   tier}. Used for voice-add, manual add, and CSV import so anything entered is
   either tagged correctly or disqualified with a reason.
   ===================================================================== */
const SWEET_CATS = new Set(['Desserts','Ice Cream','Jam','Chocolate','Candy & Gummies','Cookies','Dried Fruit','Protein Bar']);
const CLS_RULES = [
  {lvl:'L1', kind:'trans fat / hydrogenated oil', pats:[/partially hydrogenated[a-z ]*/, /\bhydrogenated [a-z ]*oil/, /\btrans[- ]fat/]},
  {lvl:'L2', kind:'regulatory-gap additive', pats:[/potassium bromate/, /azodicarbonamide/, /allura red|red\s*(no\.?\s*)?40|red\s*#?\s*40/, /tartrazine|sunset yellow|yellow\s*[56]/, /brilliant blue|blue\s*[12]/, /titanium dioxide/, /\bbha\b/, /\bbht\b/, /\btbhq\b/, /propyl gallate/, /sodium benzoate/, /sodium (nitrite|nitrate)/]},
  {lvl:'L3', kind:'industrial seed oil', pats:[/canola/, /soybean oil/, /\bsoy oil/, /sunflower oil/, /safflower/, /corn oil/, /cottonseed/, /vegetable oil/, /peanut oil/, /rapeseed/, /palm kernel/, /grapeseed/, /rice bran oil/]},
  {lvl:'L3', kind:'emulsifier / gum', pats:[/carrageenan/, /cellulose gum/, /carboxymethyl\w*/, /polysorbate/, /xanthan/, /guar gum/, /locust bean gum/, /carob bean gum/, /gellan gum/, /\blecithin\b/, /mono-?\s*(and|&)?\s*di-?glycerides|monoglycerides?|diglycerides?/, /\bdatem\b/, /polyglycerol/]},
  {lvl:'L3', kind:'artificial sweetener', pats:[/sucralose/, /aspartame/, /acesulfame/, /\bace-?k\b/, /saccharin/, /neotame/, /\bsplenda\b/]},
  {lvl:'L3', kind:'sugar alcohol / polyol', pats:[/erythritol/, /xylitol/, /sorbitol/, /maltitol/, /\bisomalt\b/, /\bmannitol\b/]},
  {lvl:'L3', kind:'engineered fibre filler', pats:[/soluble corn fib(er|re)/, /isomalto-?oligosaccharide|\bimo\b/, /polydextrose/, /vegetable glycerin/, /\bmaltodextrin\b/]},
];
const PROCESSED_SUGAR = [/high[- ]fructose corn syrup/, /\bhfcs\b/, /corn syrup/, /glucose syrup/, /invert sugar/];
const NATURAL_SUGAR = [/\bcane sugar\b/, /coconut sugar/, /\bbrown sugar\b/, /\bhoney\b/, /\bmaple\b/, /molasses/, /\bagave\b/, /\bcane\b/, /\bsugar\b/, /\bdextrose\b/, /rice syrup/, /tapioca syrup/, /date (syrup|paste)/, /fruit juice concentrate/, /\ballulose\b/, /\bsyrup\b/];
const ISOLATE_SIG = [/\bisolate\b/, /whey protein/, /pea protein/, /protein concentrate/, /micellar casein/, /\bsoy protein\b/, /rice protein/, /egg white protein/, /collagen peptides/];
const TIER1_SIG = [/sprouted/, /sourdough/, /wild ferment/, /grass[- ]fed/, /\ba2\b/, /pasture[- ]?raised|pastured/, /raw milk/, /extra virgin olive oil/, /single[- ]origin/, /\bcultured\b/, /\bfermented\b/, /bronze[- ]die/, /100% grass/];
function firstHit(text, pats){ for(const re of pats){ const m=text.match(re); if(m) return m[0].trim(); } return null; }
function classify(name, cat, ingr){
  let text=(' '+(ingr||'')+' '+(name||'')+' ').toLowerCase();
  // neutralise negations so "sugar free" / "no added sugar" doesn't read as added sugar
  const negScrub = text.replace(/sugar[- ]?free|no (added )?sugar|zero sugar|unsweetened|0g sugar|without sugar/g,' ');
  const sweet = SWEET_CATS.has(cat);
  for(const g of CLS_RULES){
    const hit=firstHit(text, g.pats);
    if(hit) return {decision:'disqualify', dqLevel:g.lvl, ingredient:hit, reason:`${g.lvl} · ${g.kind} — “${hit}”`, flag:null, tier:null};
  }
  const proc=firstHit(text, PROCESSED_SUGAR);
  if(proc) return {decision:'disqualify', dqLevel:'L2', ingredient:proc, reason:`L2 · processed sugar syrup — “${proc}”`, flag:null, tier:null};
  const natSugar=firstHit(negScrub, NATURAL_SUGAR);
  if(natSugar && !sweet) return {decision:'disqualify', dqLevel:'L2', ingredient:natSugar, reason:`L2 · added sugar in a savory / staple item — “${natSugar}”`, flag:null, tier:null};
  const isolate=firstHit(text, ISOLATE_SIG);
  if(isolate) return {decision:'tier2', dqLevel:null, flag:'tool', tier:2, reason:`Clean engineered protein (${isolate}) with no gums or sweeteners — capped at Tier 2.`};
  if(natSugar && sweet) return {decision:'tier3', dqLevel:null, flag:'sugar', tier:3, reason:`Matrix-approved sweetener in an inherently-sweet category (“${natSugar}”) — Tier 3.`};
  const t1=firstHit(text, TIER1_SIG);
  if(t1) return {decision:'tier1', dqLevel:null, flag:'clean', tier:1, reason:`Whole-food clean with a Tier-1 signal (${t1}).`};
  return {decision:'tier2', dqLevel:null, flag:'clean', tier:2, reason:`Passes every hard filter — a clean, conventional Tier-2 pick.`};
}

/* ---- voice food parsing ----
   Understands quantities ("two boiled eggs", "half a chicken breast", "a scoop of whey"),
   composite dishes ("chicken spinach wrap"), and a wide whole-food table. Each match takes
   a sensible default PORTION and multiplies its protein by the quantity spoken. Everything
   runs on-device — no text leaves the phone. */
const QTYWORD={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,half:.5,quarter:.25,couple:2,few:3,several:3,double:2,triple:3};
function numToken(tok){ if(tok==null) return null; if(QTYWORD[tok]!=null) return QTYWORD[tok];
  if(/^\d+\/\d+$/.test(tok)){ const [a,b]=tok.split('/').map(Number); return b?a/b:null; }
  const n=parseFloat(tok); return isFinite(n)?n:null; }
// Ordered MOST-SPECIFIC first (multi-word dishes before the bare ingredient), so
// "chicken spinach wrap" scores as a wrap, not as plain chicken. protein = grams per unit.
const FOODS=[
  {name:'Chicken & spinach wrap', unit:'wrap', protein:30, keys:['chicken spinach wrap','chicken and spinach wrap','chicken spinach roll','spinach chicken wrap']},
  {name:'Chicken wrap', unit:'wrap', protein:28, keys:['chicken wrap','grilled chicken wrap']},
  {name:'Turkey wrap', unit:'wrap', protein:27, keys:['turkey wrap']},
  {name:'Protein shake', unit:'shake', protein:25, keys:['protein shake','protein smoothie']},
  {name:'Whey protein', unit:'scoop', protein:24, keys:['whey protein','scoop of whey','protein powder','protein scoop','whey isolate','whey']},
  {name:'Greek yogurt', unit:'cup', protein:17, keys:['greek yogurt','skyr']},
  {name:'Cottage cheese', unit:'cup', protein:24, keys:['cottage cheese']},
  {name:'Grilled chicken breast', unit:'breast', protein:31, keys:['grilled chicken breast','chicken breast','grilled chicken','roast chicken']},
  {name:'Ground beef', unit:'serving', protein:25, keys:['ground beef','minced beef']},
  {name:'Steak / beef', unit:'serving', protein:26, keys:['steak','beef']},
  {name:'Salmon', unit:'fillet', protein:22, keys:['salmon']},
  {name:'Tuna', unit:'can', protein:26, keys:['can of tuna','tuna']},
  {name:'Shrimp', unit:'serving', protein:24, keys:['shrimp','prawns']},
  {name:'Egg whites', unit:'serving', protein:11, keys:['egg whites','egg white']},
  {name:'Egg', unit:'egg', protein:6, keys:['boiled egg','scrambled egg','fried egg','eggs','egg']},
  {name:'Protein bar', unit:'bar', protein:20, keys:['protein bar','protein bars']},
  {name:'Tempeh', unit:'serving', protein:18, keys:['tempeh']},
  {name:'Tofu', unit:'serving', protein:10, keys:['tofu']},
  {name:'Lentils / dal', unit:'cup', protein:18, keys:['lentils','lentil','dal','daal']},
  {name:'Beans / chickpeas', unit:'cup', protein:15, keys:['chickpeas','black beans','beans','rajma']},
  {name:'Peanut / nut butter', unit:'2 tbsp', protein:7, keys:['peanut butter','almond butter','nut butter']},
  {name:'Almonds / nuts', unit:'handful', protein:6, keys:['almonds','cashews','walnuts','mixed nuts','nuts']},
  {name:'Milk', unit:'cup', protein:8, keys:['glass of milk','milk']},
  {name:'Cheese', unit:'slice', protein:7, keys:['cheese']},
  {name:'Turkey', unit:'serving', protein:29, keys:['turkey']},
  {name:'Ham / deli', unit:'serving', protein:18, keys:['ham','deli meat']},
  {name:'Bacon', unit:'2 rashers', protein:12, keys:['bacon']},
  {name:'Sausage', unit:'link', protein:14, keys:['sausage','sausages']},
  {name:'Burger', unit:'burger', protein:25, keys:['hamburger','cheeseburger','burger']},
  {name:'Burrito', unit:'burrito', protein:20, keys:['burrito']},
  {name:'Sandwich', unit:'sandwich', protein:18, keys:['sandwich']},
  {name:'Pizza', unit:'slice', protein:12, keys:['slice of pizza','pizza']},
  {name:'Oats / oatmeal', unit:'bowl', protein:6, keys:['oatmeal','porridge','oats']},
  {name:'Quinoa', unit:'cup', protein:8, keys:['quinoa']},
  {name:'Rice', unit:'cup', protein:5, keys:['rice']},
  {name:'Pasta', unit:'plate', protein:8, keys:['pasta','spaghetti']},
  {name:'Bread / toast', unit:'slice', protein:4, keys:['slice of bread','toast','bread']},
  {name:'Hummus', unit:'serving', protein:5, keys:['hummus']},
];
function findQty(pre){
  const toks=pre.trim().split(' ').filter(Boolean).slice(-3);
  let article=null;   // "a"/"an" is a weak default — a real number or fraction wins ("half a chicken")
  for(let i=toks.length-1;i>=0;i--){ const tok=toks[i], q=numToken(tok);
    if(q==null) continue;
    if(tok==='a'||tok==='an'){ if(article==null) article=q; continue; }
    return q;
  }
  return article!=null?article:1;
}
// distinctive (brand-ish) tokens from a product name, minus generic food words
const STOPTOK=new Set(['organic','with','protein','whey','milk','yogurt','greek','plain','unflavored','grass','free','range','natural','original','classic','premium','bars','cheese','butter','olive','extra','virgin','nonfat','whole','salt','dark','chocolate','cacao','vanilla','cream','sugar','style','family','farms','farm','creamery','organics','select','ingredients','flavor','flavored','powder','isolate','fine','pure','real','food','foods','sprouted','grain','bread','fresh','pressed','pure','zero','carb']);
// every word that appears in the generic FOOD table — these are NEVER brand triggers, so
// "chicken", "spinach", "whey", "eggs" route to the generic parser, not to catalog matching.
const FOOD_WORDS=new Set(FOODS.flatMap(f=>f.keys.join(' ').split(' ')).filter(Boolean));
// portion / vessel words — never brand triggers ("a BOWL of Fage" must not match a product named "…Bowl")
const PORTION_WORDS=new Set(['bowl','bowls','cup','cups','plate','plates','glass','glasses','handful','slice','slices','piece','pieces','serving','servings','scoop','scoops','portion','portions','can','cans','link','links','fillet','fillets','breast','shake','shakes','rasher','rashers','bar','bars']);
// when a real brand is named, its category's GENERIC phrasing means the same item — blank it so it isn't double-counted
const CAT_GENERIC={
  'Yogurt':['greek yogurt','yogurt','skyr'],
  'Clear Whey':['protein shake','protein smoothie','whey protein','protein powder','scoop of whey','whey isolate','protein scoop','whey'],
  'Cheese':['cottage cheese','cheese'],
  'Nut Butter':['peanut butter','almond butter','nut butter'],
  'Eggs':['egg whites','egg white','boiled egg','scrambled egg','fried egg','eggs','egg'],
  'Plant Milk':['glass of milk','milk'],
  'Protein Bar':['protein bar','protein bars'],
};
function sigToks(name){ return (name||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4 && !STOPTOK.has(w)); }
function localParse(text){
  let t=(' '+(text||'').toLowerCase()+' ').replace(/[^a-z0-9\/\s]/g,' ').replace(/\s+/g,' ');
  const items=[]; let total=0;
  // 1) CATALOG BRAND MATCH — if the user names a real product (Isopure, Fage, Naked…),
  //    log one serving of THAT product using its verified per-serving protein.
  try{
    const prods=products(); const freq={}, ptoks={};
    prods.forEach(p=>{ const s=sigToks(p.name); ptoks[p.id]=s; s.forEach(w=>freq[w]=(freq[w]||0)+1); });
    const used=new Set();
    // candidate triggers: distinctive (rare), NOT a generic food word or portion/vessel word
    const present=[]; for(const w in freq){ if(freq[w]<=4 && !FOOD_WORDS.has(w) && !PORTION_WORDS.has(w) && t.indexOf(' '+w+' ')>=0) present.push(w); }
    present.forEach(w=>{
      let best=null, bs=0;
      prods.forEach(p=>{ if(used.has(p.id)||!ptoks[p.id].includes(w))return; let s=0; ptoks[p.id].forEach(x=>{ if(t.indexOf(' '+x+' ')>=0)s++; }); if(s>bs){bs=s;best=p;} });
      if(best && !used.has(best.id) && (best.protein||0)>0){
        used.add(best.id);
        const idx=t.indexOf(' '+w+' ');
        const qty=findQty(t.slice(0,idx+1));
        const g=Math.round((best.protein||0)*qty);
        items.push({name:best.name, qty:(qty===1?'1 serving':qty+' servings')+' · ~'+best.protein+'g/serv · catalog', protein:g});
        total+=g;
        ptoks[best.id].forEach(x=>{ t=t.split(' '+x+' ').join('   '); });
        // the named brand IS this category's food — blank the generic phrasing so it isn't double-counted
        (CAT_GENERIC[best.cat]||[]).forEach(ph=>{ t=t.split(' '+ph+' ').join('   '); });
      }
    });
  }catch(e){}
  // 2) GENERIC FOOD TABLE on whatever text remains
  for(const f of FOODS){
    let mIdx=-1;
    for(const key of f.keys){ const i=t.indexOf(' '+key+' '); if(i>=0){ mIdx=i; break; } }
    if(mIdx<0) continue;
    const qty=findQty(t.slice(0,mIdx+1));
    const g=Math.round(f.protein*qty);
    const q=(qty===1?'1':(qty%1?qty.toFixed(2).replace(/0$/,''):qty))+' '+f.unit+(qty!==1&&!/\s/.test(f.unit)?'s':'')+' · ~'+f.protein+'g each';
    items.push({name:f.name, qty:q, protein:g}); total+=g;
    f.keys.forEach(k=>{ t=t.split(' '+k+' ').join('   '); });
  }
  if(!items.length){ items.push({name:'Mixed intake',qty:'rough estimate — edit after logging',protein:20}); total=20; }
  OV.data.items=items; OV.data.total=total;
}

/* ---------- CATEGORY UPLOAD (CSV / TSV) ----------
   Upload a whole new category as a spreadsheet (export the Excel sheet as CSV first) and
   merge it into the local database. Column names are matched flexibly; only a product name
   is strictly required. A preview sheet shows exactly what will be added before you commit. */
function parseDelimited(text, delim){
  const rows=[]; let row=[], field='', q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
const COLMAP={
  name:['name','product','product name','item','title'],
  cat:['category','cat','aisle','type'],
  price:['price','cost','pack price','$','price ($)','price($)'],
  size:['size','pack','size/pack','pack size','size / pack'],
  protein:['protein','protein per serving','protein/serving','protein (g)','protein g','protein per serve'],
  servings:['servings','servings per pack','serves','servings/pack','servings per pack'],
  store:['store','retailer','availability','stores','where'],
  tier:['tier','rating'],
  flag:['flag','classification','class','flags'],
  audit:['audit','notes','note','justification','reason','why'],
  ingr:['ingredients','ingredient','deck','ingredient deck']
};
function normHeader(h){ return String(h||'').trim().toLowerCase(); }
function mapHeaders(headerRow){
  const idx={}; headerRow.forEach((h,i)=>{ const n=normHeader(h);
    for(const key in COLMAP){ if(COLMAP[key].includes(n)){ if(idx[key]==null) idx[key]=i; } }
  });
  return idx;
}
function normStore(v){ const s=String(v||'').trim().toLowerCase();
  if(/whole\s*foods|^wf$/.test(s)) return 'wf';
  if(/h.?e.?b/.test(s)) return 'heb';
  if(/online|direct|amazon|central|other/.test(s)) return 'other';
  return 'heb'; }
function num(v){ const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; }
const IMPORT_FLAG_TIER={clean:1,tool:2,sugar:3,seed:2,emul:2};
function onCatFile(e){ const f=e.target.files[0]; if(!f){return;}
  if(/\.xlsx?$/i.test(f.name)){ toast('Save the Excel sheet as CSV first, then upload'); e.target.value=''; return; }
  const r=new FileReader();
  r.onload=()=>{ try{ buildImport(r.result, f.name); }catch(err){ toast('Could not read that file'); }
    finally{ e.target.value=''; } };
  r.readAsText(f);
}
function buildImport(text, fname){
  const delim = (text.split('\n')[0]||'').split('\t').length > (text.split('\n')[0]||'').split(',').length ? '\t' : ',';
  const rows=parseDelimited(text, delim);
  if(rows.length<2){ toast('No rows found in the file'); return; }
  const idx=mapHeaders(rows[0]);
  if(idx.name==null){ toast('Need a "name" column'); return; }
  const warnings=[]; const items=[];
  for(let i=1;i<rows.length;i++){ const r=rows[i]; const g=k=>idx[k]!=null?r[idx[k]]:'';
    const name=String(g('name')||'').trim(); if(!name) continue;
    let cat=String(g('cat')||'').trim();
    let flag=String(g('flag')||'').trim().toLowerCase(); if(!IMPORT_FLAG_TIER[flag]) flag='';
    let tier=parseInt(num(g('tier')),10); if(!(tier>=1&&tier<=3)) tier=flag?IMPORT_FLAG_TIER[flag]:2;
    if(!flag) flag=tier===1?'clean':tier===3?'sugar':'clean';
    const protein=num(g('protein')), servings=Math.max(1,Math.round(num(g('servings'))||1)), price=num(g('price'));
    if(protein<=0) warnings.push(`Row ${i+1} “${name}”: no protein value (set to 0).`);
    if(price<=0) warnings.push(`Row ${i+1} “${name}”: no price (protein/$ will show —).`);
    items.push({ name, cat:cat||'', store:normStore(g('store')), price, size:String(g('size')||'').trim()||'1 pack',
      protein, servings, tier, flag, audit:String(g('audit')||'').trim()||'Imported entry — verify ingredients.',
      ingr:String(g('ingr')||'').trim() });
  }
  if(!items.length){ toast('No usable rows'); return; }
  // category resolution: prefer the sheet's category column; else infer one name from filename
  const fileCat = fname.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
  const cats=[...new Set(items.map(x=>x.cat).filter(Boolean))];
  const singleCat = cats.length? null : (fileCat||'Imported');
  if(singleCat) items.forEach(x=>x.cat=singleCat);
  // run the science on any row that provided an ingredient list: disqualify or (re)tier it
  const kept=[], disq=[];
  items.forEach(x=>{
    if((x.ingr||'').trim()){
      const c=classify(x.name, x.cat, x.ingr);
      if(c.decision==='disqualify'){ disq.push({name:x.name, cat:x.cat, dqLevel:c.dqLevel, reason:c.reason}); return; }
      x.tier=c.tier; x.flag=c.flag; x.audit=c.reason;
    }
    kept.push(x);
  });
  const finalCats=[...new Set(kept.map(x=>x.cat))];
  const newCats=finalCats.filter(c=>!allCats().includes(c));
  OV={kind:'import', data:{items:kept, disq, cats:finalCats, newCats, warnings, fname}};
  renderOverlay(true);
}

/* --- serving scaler: multiply ingredient quantities by a factor --- */
const UFRAC={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
function fmtQty(v){ if(!isFinite(v)) return ''; if(Math.abs(v-Math.round(v))<1e-6) return String(Math.round(v));
  const whole=Math.floor(v), frac=v-whole; const map=[[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[2/3,'⅔'],[.75,'¾'],[.875,'⅞']];
  for(const [val,g] of map){ if(Math.abs(frac-val)<.045) return (whole>0?whole+' ':'')+g; }
  return String(Math.round(v*100)/100); }
function scaleIngredientLine(text, f){ if(!f||f===1||!isFinite(f)) return text;
  return String(text).replace(/(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+|[½¼¾⅓⅔⅛⅜⅝⅞])/g, (m)=>{ let val;
    if(UFRAC[m]!=null) val=UFRAC[m];
    else if(m.indexOf('/')>=0){ const parts=m.trim().split(/\s+/); if(parts.length===2){ const ab=parts[1].split('/'); val=(+parts[0])+(+ab[0]/+ab[1]); } else { const ab=m.split('/'); val=+ab[0]/+ab[1]; } }
    else val=parseFloat(m);
    if(!isFinite(val)) return m; const out=fmtQty(val*f); return out||m; }); }

/* ---- recipe photo -> downscale -> OCR (on-device, lazy CDN; graceful fallback) ---- */
function onRecipePhoto(e){ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  // keep a clean colour copy for display, and a contrast-boosted grayscale copy for recognition
  processImage(f, (dataUrl, ocrSrc)=>{ OV.data.image=dataUrl; OV.data.ocrBusy=true; OV.data.ocrPct=0; renderOverlay();
    ocrImage(ocrSrc||dataUrl, pct=>{ OV.data.ocrPct=pct;
        const el=document.querySelector('#overlays .note'); if(el && OV.data.ocrBusy) el.textContent='Reading image… '+Math.round(pct*100)+'%';
      }).then(text=>{
      OV.data.ocrBusy=false; OV.data.ocrPct=null;
      const clean=(text||'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
      if(clean.length>8){ parsePasteFill(clean, false); OV.data.paste=OV.data.paste||clean; toast('Read image — review the fields'); }
      else { toast('Couldn’t read much text — paste or type it'); }

    }).catch(()=>{ OV.data.ocrBusy=false; OV.data.ocrPct=null; renderOverlay(); toast('OCR needs a connection — image saved; paste or type the text'); });
  });
}
// Load → scale into the OCR sweet spot (upscale tiny screenshots, cap huge ones) → return a
// colour JPEG for display AND a grayscale + contrast-stretched JPEG that reads better in Tesseract.
function processImage(file, cb){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    try{
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height; const mx=Math.max(w,h);
      let scale=1; if(mx>1600) scale=1600/mx; else if(mx<1000) scale=Math.min(2, 1400/mx);   // upscale small reel screenshots
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      const display=c.toDataURL('image/jpeg',0.82);
      let ocr=display;
      try{ const id=ctx.getImageData(0,0,w,h), px=id.data;
        for(let i=0;i<px.length;i+=4){ let g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]; g=(g-128)*1.45+132; px[i]=px[i+1]=px[i+2]=g<0?0:g>255?255:g; }
        ctx.putImageData(id,0,0); ocr=c.toDataURL('image/jpeg',0.9);
      }catch(e){}
      cb(display, ocr);
    }catch(e){ cb(r.result, r.result); }
  }; img.onerror=()=>cb(r.result, r.result); img.src=r.result; };
  r.onerror=()=>toast('Could not read that image'); r.readAsDataURL(file);
}
let _tessLoading=null, _tessWorker=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tessLoading) return _tessLoading;
  const urls=['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js','https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'];
  _tessLoading=new Promise((resolve,reject)=>{ let i=0; const tryNext=()=>{ if(i>=urls.length){ reject(new Error('no cdn')); return; }
    const s=document.createElement('script'); s.src=urls[i++]; s.async=true;
    s.onload=()=>{ window.Tesseract?resolve(window.Tesseract):tryNext(); }; s.onerror=tryNext; document.head.appendChild(s); };
    tryNext(); });
  return _tessLoading;
}
function ocrImage(dataUrl, onProgress){
  // race recognition against a timeout so a stuck worker never freezes the UI
  return new Promise((resolve,reject)=>{
    let done=false; const to=setTimeout(()=>{ if(!done){ done=true; reject(new Error('ocr timeout')); } }, 60000);
    loadTesseract().then(T=>T.recognize(dataUrl,'eng',{ logger:m=>{ if(m.status==='recognizing text'&&onProgress) onProgress(m.progress); } }))
      .then(res=>{ if(done) return; done=true; clearTimeout(to); resolve((res&&res.data&&res.data.text)||''); })
      .catch(err=>{ if(done) return; done=true; clearTimeout(to); reject(err); });
  });
}

/* ---- import a recipe from a web link (JSON-LD schema.org/Recipe, via a CORS proxy) ---- */
function isoDurationToMin(s){ if(!s) return ''; const m=String(s).match(/P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/i); if(!m) return ''; const t=(+m[1]||0)*1440+(+m[2]||0)*60+(+m[3]||0); return t?String(t):''; }
function ldText(v){ if(!v) return []; if(typeof v==='string') return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(Array.isArray(v)) return v.map(x=> typeof x==='string'?x:((x&&(x.text||x.name))||'')).map(x=>String(x).trim()).filter(Boolean); return []; }
function ldInstructions(ri){ if(!ri) return []; if(typeof ri==='string') return ri.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(Array.isArray(ri)){ const out=[]; ri.forEach(it=>{ if(typeof it==='string') out.push(it);
    else if(it && String(it['@type']||'').toLowerCase()==='howtosection' && Array.isArray(it.itemListElement)) it.itemListElement.forEach(st=>out.push((st&&(st.text||st.name))||''));
    else out.push((it&&(it.text||it.name))||''); }); return out.map(s=>String(s).trim()).filter(Boolean); } return []; }

  const scan=node=>{ if(!node||typeof node!=='object') return null; const t=node['@type']; const types=Array.isArray(t)?t:[t];
    if(types.some(x=>String(x).toLowerCase()==='recipe')) return node;
    if(Array.isArray(node['@graph'])){ for(const g of node['@graph']){ const r=scan(g); if(r) return r; } } return null; };
  if(Array.isArray(json)){ for(const n of json){ const r=scan(n); if(r) return r; } return null; } return scan(json);

function recipeFromLd(r){

  const n=r.nutrition||{}; const num=v=>{ const s=String(v==null?'':v).replace(/[^0-9.]/g,''); return s?String(Math.round(+s)):''; };
  return { title:String(r.name||'').trim(), description:String(r.description||'').replace(/\s+/g,' ').trim(),
    image:(typeof img==='string')?img:'', servings:String(Array.isArray(r.recipeYield)?r.recipeYield[0]:(r.recipeYield||'')).trim(),
    prepTime:isoDurationToMin(r.prepTime), cookTime:isoDurationToMin(r.cookTime), totalTime:isoDurationToMin(r.totalTime),
    cuisine:String(Array.isArray(r.recipeCuisine)?r.recipeCuisine[0]:(r.recipeCuisine||'')).trim(),
    course:String(Array.isArray(r.recipeCategory)?r.recipeCategory[0]:(r.recipeCategory||'')).trim(),

function parseRecipeJsonLd(html){
  const scripts=[...String(html||'').matchAll(/<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)];
  for(const s of scripts){ let json; try{ json=JSON.parse(s[1].trim().replace(/^\s*<!--/,'').replace(/-->\s*$/,'')); }catch(e){ continue; }

function metaContent(html, prop){

function parseOgFallback(html){ const title=metaContent(html,'og:title')||((/<title[^>]*>([^<]+)<\/title>/i.exec(html)||[])[1]||'');

// your own Cloudflare Worker (if configured) is tried first, then public proxies as fallback
function proxyUrls(url){ const list=[]; const w=(S.workerUrl||'').trim().replace(/\/+$/,'');

/* ---- recipe text parser (headers or heuristic) ---- */
function parseRecipe(text){
  const out={title:'',ingredients:[],steps:[],servings:'',time:''};
  const lines=(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return out;
  const joined=lines.join('  ');
  let m=joined.match(/serves?\s*(\d+)/i)||joined.match(/(\d+)\s*servings/i)||joined.match(/yield[^\d]{0,6}(\d+)/i); if(m) out.servings=m[1];
  const th=joined.match(/(\d+)\s*(hours?|hrs?)\b/i), tm=joined.match(/(\d+)\s*(mins?|minutes?)\b/i);
  if(th||tm){ let mins=0; if(th)mins+=parseInt(th[1],10)*60; if(tm)mins+=parseInt(tm[1],10); out.time=String(mins); }
  const clean=l=>l.replace(/^[\s•▢●○◦\-*–—·]+/,'').replace(/^\d+[.)]\s*/,'').trim();
  const idxIng=lines.findIndex(l=>/^ingredients?\b/i.test(l));
  const idxStep=lines.findIndex(l=>/^(instructions?|methods?|directions?|steps?|preparation|how to make|recipe)\b/i.test(l));
  if(idxIng>=0){
    out.title=(lines.slice(0,idxIng).find(x=>x.length>1)||'').replace(/[:•].*$/,'').trim();
    const end=(idxStep>idxIng)?idxStep:lines.length;
    out.ingredients=lines.slice(idxIng+1,end).map(clean).filter(Boolean);
    if(idxStep>idxIng) out.steps=lines.slice(idxStep+1).map(clean).filter(Boolean);
  } else if(idxStep>=0){
    out.title=(lines.slice(0,idxStep).find(x=>x.length>1)||'').trim();
    out.steps=lines.slice(idxStep+1).map(clean).filter(Boolean);
    out.ingredients=lines.slice(idxStep>0?0:1,idxStep).map(clean).filter(x=>x&&x!==out.title);
  } else {
    // No headers (typical of an Instagram caption): classify each line.
    out.title=lines[0];
    const measure=/\b(cups?|tbsp|tsp|tablespoons?|teaspoons?|grams?|kg|oz|lb|lbs|ml|clove|cloves|cans?|pinch|dash|handful|slices?|scoops?|sticks?)\b/i;
    const cook=/\b(add|mix|stir|blend|bake|cook|heat|boil|simmer|whisk|combine|pour|roast|grill|fry|saut|serve|preheat|fold|knead|marinate|drizzle|season|garnish|transfer|refrigerate|chill|cover|spread|layer|bring to|set aside|remove|repeat|top with|cut|place)\b/i;
    lines.slice(1).forEach(l=>{ const c=clean(l); if(!c) return;
      const numbered=/^\d+[.)]/.test(l);
      const startsQty=/^\s*[\d¼½¾⅓⅔]/.test(l) && !numbered;
      const words=c.split(/\s+/).length;
      if(startsQty || (measure.test(c) && words<=8)) out.ingredients.push(c);      // clearly an ingredient
      else if(numbered || cook.test(c) || /[.!]$/.test(c) || words>10) out.steps.push(c); // a method step
      else out.ingredients.push(c);
    });
  }
  if(out.title.length>90) out.title=out.title.slice(0,90);
  return out;
}

/* ---- shopping list ---- */
function sid(){ return 's'+Date.now()+'_'+Math.floor(Math.random()*1e4); }
function stripQty(s){ return (s||'').toLowerCase()
  .replace(/^[\s•▢●○◦\-*–—·\d.]+/,'')
  .replace(/\b\d+([\/.]\d+)?\s*(g|kg|oz|lb|lbs|ml|l|cups?|tbsp|tablespoons?|tsp|teaspoons?|cloves?|cans?|slices?|pinch|dash|handful|scoops?|pieces?|sticks?)\b/g,' ')
  .replace(/\b(of|fresh|large|small|medium|chopped|diced|minced|sliced|ripe|boneless|skinless|to taste|optional|for serving|finely|roughly)\b/g,' ')
  .replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim(); }
function catalogMatchIngredient(text){
  const words=stripQty(text).split(' ').filter(w=>w.length>=4);
  if(!words.length) return null;
  let best=null,bs=0;
  products().forEach(p=>{ const hay=(p.name+' '+p.cat).toLowerCase(); let s=0; words.forEach(w=>{ if(hay.includes(w)) s++; }); if(s>bs){bs=s;best=p;} });
  return bs>=1?best:null;
}
// normalized key so duplicate ingredients (from different recipes / manual adds) merge into one line
function shopKey(text){ return stripQty(text) || (text||'').toLowerCase().trim(); }
function pushShop(text, recipeId){ text=(text||'').trim(); if(!text) return false; const key=shopKey(text);
  const m=catalogMatchIngredient(text);
  const ex=key && S.shopping.find(s=>!s.checked && s.key===key);
  if(ex){ ex.count=(ex.count||1)+1; if(ex.matchId==null&&m) ex.matchId=m.id; return false; }
  S.shopping.push({id:sid(), text, key, recipeId:recipeId||null, matchId:m?m.id:null, checked:false, count:1}); return true;
}
function addIngredientToShopping(recipeId, idx){ const r=recipeById(recipeId); if(!r) return;
  const text=(r.ingredients||[])[idx]; if(!text) return;
  const fresh=pushShop(text, recipeId);
  save(); if(OV.kind==='recipe') renderOverlay(); render(); toast(fresh?'Added to your shopping list':'Already on your list — quantity bumped');
}
function addAllToShopping(recipeId){ const r=recipeById(recipeId); if(!r) return; let added=0, merged=0;
  (r.ingredients||[]).forEach(text=>{ if(pushShop(text, recipeId)) added++; else merged++; });
  save(); closeOverlay(); go('list'); toast('Added '+added+' item'+(added===1?'':'s')+(merged?' · '+merged+' merged':''));
}
function addManualShop(){ const t=(newShopText||'').trim(); if(!t) return; pushShop(t,null); newShopText=''; save(); render(); }
function toggleShopItem(id){ const x=S.shopping.find(s=>s.id===id); if(x){ x.checked=!x.checked; save(); render(); } }
function delShopItem(id){ S.shopping=S.shopping.filter(s=>s.id!==id); save(); render(); }
function bumpShop(id, d){ const x=S.shopping.find(s=>s.id===id); if(!x) return; x.count=Math.max(1,(x.count||1)+d); save(); render(); }
function clearCheckedShop(){ S.shopping=S.shopping.filter(s=>!s.checked); save(); render(); toast('Cleared checked items'); }
let _shopClearArm=false, _shopClearT;
function clearAllShop(){ if(!S.shopping.length) return;
  if(!_shopClearArm){ _shopClearArm=true; render(); clearTimeout(_shopClearT); _shopClearT=setTimeout(()=>{ _shopClearArm=false; if(S.screen==='list') render(); },2600); return; }
  _shopClearArm=false; clearTimeout(_shopClearT); S.shopping=[]; save(); render(); toast('Shopping list cleared'); }
// group active items by the store of their catalog match (unmatched → their own group)
function shopGroups(active){ const g={heb:[],wf:[],other:[],un:[]};
  active.forEach(x=>{ const m=x.matchId!=null?byId(x.matchId):null; const k=(m&&g[m.store])?m.store:'un'; g[k].push(x); });
  return g; }

/* ---------- boot ---------- */
(function(){ const h=(location.hash||'').replace('#','');
  if(['home','queue','rank','data','list','cook'].includes(h)) S.screen=h; })();
window.addEventListener('hashchange',()=>{ const h=(location.hash||'').replace('#',''); if(['home','queue','rank','data','list','cook'].includes(h)) go(h); });

(async function boot(){
  render();                                   // paint immediately from localStorage
  try{ await idbOpen(); await hydrateImages(); }catch(e){}
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  refreshStorageEstimate();
  render();                                   // repaint with images hydrated from IndexedDB
  try{ driveAutoSync(); }catch(e){}           // silent cloud backup if connected + due
})();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
